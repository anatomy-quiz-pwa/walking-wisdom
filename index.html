<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>慢慢走 Walking Wisdom</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #fff4dd;
      --ink: #2a1b12;
      --wood: #7a4a27;
      --leaf: #4d7455;
      --gold: #f2c46d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #1d1713;
      color: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255, 244, 221, 0.05), rgba(0, 0, 0, 0.2)),
        #211813;
    }

    canvas {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid rgba(255, 244, 221, 0.18);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.5);
      background: #211813;
      touch-action: none;
    }

    .hud {
      position: fixed;
      left: 12px;
      right: 12px;
      top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .pill,
    button {
      border: 1px solid rgba(255, 244, 221, 0.3);
      border-radius: 8px;
      background: rgba(42, 27, 18, 0.78);
      color: var(--paper);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(8px);
    }

    .pill {
      max-width: min(680px, 72vw);
      padding: 9px 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      min-height: 40px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      pointer-events: auto;
    }

    button:hover { border-color: rgba(242, 196, 109, 0.75); }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(19, 13, 10, 0.58);
      z-index: 20;
    }

    .modal-backdrop.show { display: grid; }

    .modal {
      width: min(760px, 100%);
      border: 1px solid rgba(255, 244, 221, 0.22);
      border-radius: 8px;
      background: rgba(255, 244, 221, 0.96);
      color: var(--ink);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .modal-content {
      padding: 22px;
    }

    .modal-content p {
      margin: 0 0 16px;
      line-height: 1.75;
      font-size: 17px;
    }

    .dialogue-card {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 18px;
      align-items: center;
    }

    .avatar-frame {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #ead3aa;
      border: 1px solid rgba(42, 27, 18, 0.18);
      overflow: hidden;
    }

    .avatar-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }


    .modal-actions button {
      background: #5d3922;
      color: #fff4dd;
    }

    .iframe-modal {
      width: min(1100px, 96vw);
      height: min(760px, 92vh);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #1c1410;
      border-color: rgba(190, 145, 80, 0.22);
    }

    .iframe-head,
    .iframe-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: #16100b;
      color: #d4a55a;
      border-bottom: 1px solid rgba(190, 145, 80, 0.18);
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .iframe-head button {
      background: transparent;
      color: #ead3aa;
      border: 1px solid rgba(190, 145, 80, 0.35);
    }

    .iframe-head button:hover {
      border-color: var(--gold);
      background: rgba(212, 165, 90, 0.12);
    }

    .iframe-foot {
      font-size: 13px;
      justify-content: flex-end;
      flex-wrap: wrap;
      border-bottom: 0;
      border-top: 1px solid rgba(190, 145, 80, 0.18);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .dialogue-body {
      width: 100%;
      height: 100%;
      overflow: auto;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(212, 165, 90, 0.06), transparent 60%),
        #1c1410;
      color: #e8d9b8;
      padding: 26px 32px 32px;
      line-height: 1.75;
    }

    .qa-image {
      display: block;
      max-width: 100%;
      max-height: 280px;
      margin: 0 auto 18px;
      border-radius: 8px;
      object-fit: contain;
    }

    .qa-hero {
      background: rgba(50, 35, 22, 0.4);
      border: 1px solid rgba(190, 145, 80, 0.18);
      border-radius: 14px;
      padding: 22px 26px 18px;
      margin-bottom: 22px;
    }

    .qa-hero-title {
      font-family: "Noto Serif TC", "Songti TC", "Noto Serif", serif;
      color: #d4a55a;
      font-size: 34px;
      letter-spacing: 0.42em;
      margin: 0 0 10px;
      font-weight: 600;
    }

    .qa-hero-sub {
      color: rgba(232, 217, 184, 0.62);
      font-size: 13px;
      margin: 0 0 16px;
      line-height: 1.75;
      letter-spacing: 0.04em;
    }

    .qa-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .qa-pill {
      background: rgba(28, 20, 14, 0.7);
      border: 1px solid rgba(190, 145, 80, 0.22);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      color: #ead3aa;
      letter-spacing: 0.04em;
    }

    .qa-pill .pill-key {
      color: rgba(232, 217, 184, 0.55);
      margin-right: 6px;
    }

    .qa-pill.success {
      background: rgba(45, 74, 53, 0.45);
      border-color: rgba(143, 200, 156, 0.32);
      color: #b6e3bf;
    }

    .qa-pill.success .pill-key {
      color: rgba(182, 227, 191, 0.7);
    }

    .qa-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    .qa-bio {
      background: rgba(50, 35, 22, 0.4);
      border: 1px solid rgba(190, 145, 80, 0.2);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 0;
    }

    .qa-bio-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background: #2a1f17;
      border: 1px solid rgba(190, 145, 80, 0.2);
    }

    .qa-bio-label {
      font-size: 11px;
      letter-spacing: 0.22em;
      color: rgba(232, 217, 184, 0.5);
      text-transform: uppercase;
      margin: 4px 0 0;
    }

    .qa-bio-name {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      color: #d4a55a;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .qa-bio-lines {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.7;
      color: #e0cfa6;
    }

    .qa-bio-lines p {
      margin: 0 0 6px;
    }

    .qa-bio-lines p:last-child {
      margin: 0;
    }

    .qa-bio-title {
      margin: 4px 0 0;
      padding-top: 12px;
      border-top: 1px solid rgba(190, 145, 80, 0.2);
      font-size: 13px;
      color: rgba(232, 217, 184, 0.55);
      font-style: italic;
    }

    .qa-content {
      min-width: 0;
    }

    .qa-cafe-tag {
      font-size: 11px;
      letter-spacing: 0.28em;
      color: rgba(232, 217, 184, 0.5);
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    .qa-question {
      font-size: 19px;
      margin: 0 0 22px;
      color: #f0e0bb;
      line-height: 1.85;
    }

    .qa-options {
      display: grid;
      gap: 12px;
      margin: 0 0 18px;
    }

    .qa-options button {
      text-align: left;
      background: rgba(42, 30, 20, 0.55);
      color: #ebd9b3;
      border: 1px solid rgba(190, 145, 80, 0.25);
      padding: 16px 20px;
      line-height: 1.6;
      border-radius: 12px;
      font-size: 16px;
    }

    .qa-options button:hover {
      border-color: var(--gold);
      background: rgba(80, 56, 30, 0.5);
    }

    .qa-options button:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .qa-options button.correct,
    .qa-options button.wrong {
      position: relative;
      padding-right: 50px;
      font-weight: 600;
      opacity: 1;
    }

    .qa-options button.correct {
      background: rgba(45, 74, 53, 0.55);
      border-color: rgba(143, 200, 156, 0.55);
      border-width: 2px;
      color: #d6eecc;
    }

    .qa-options button.wrong {
      background: rgba(110, 50, 38, 0.5);
      border-color: rgba(220, 130, 100, 0.55);
      border-width: 2px;
      color: #f6d6c8;
    }

    .qa-options button.correct::after,
    .qa-options button.wrong::after {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .qa-options button.correct::after {
      content: "✓";
      background: var(--leaf);
    }

    .qa-options button.wrong::after {
      content: "✕";
      background: #b35a3c;
    }

    @keyframes feedback-pop {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .qa-feedback {
      margin: 0 0 18px;
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.65;
      animation: feedback-pop 0.22s ease-out;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
    }

    .qa-feedback .qa-feedback-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .qa-feedback .qa-feedback-head::before {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .qa-feedback.correct {
      background: #4d7455;
      color: #fff;
    }

    .qa-feedback.correct .qa-feedback-head::before {
      content: "✓";
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .qa-feedback.wrong {
      background: #b35a3c;
      color: #fff;
    }

    .qa-feedback.wrong .qa-feedback-head::before {
      content: "✕";
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .qa-feedback .qa-feedback-body {
      margin: 0;
    }

    .qa-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .qa-actions button {
      background: #5d3922;
      color: #fff4dd;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .shelf-book {
      border: 1px solid rgba(42, 27, 18, 0.22);
      border-radius: 8px;
      padding: 0;
      background: #fff;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      font: inherit;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .shelf-book:hover:not(.locked) {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .shelf-book.locked {
      cursor: not-allowed;
      color: rgba(42, 27, 18, 0.45);
      background: rgba(42, 27, 18, 0.06);
    }

    .book-cover-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: rgba(42, 27, 18, 0.08);
    }

    .shelf-book.locked .book-cover-img {
      filter: grayscale(1) brightness(0.55);
    }

    .shelf-book .book-meta {
      padding: 10px 12px 12px;
    }

    .shelf-book .book-title {
      font-weight: 600;
      margin: 0 0 4px;
      font-size: 14px;
    }

    .shelf-book .book-sub {
      font-size: 12px;
      color: rgba(42, 27, 18, 0.65);
      margin: 0;
    }

    .book-detail-head {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 22px;
      align-items: start;
      margin-bottom: 22px;
    }

    .book-detail-cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.45);
    }

    .book-detail h3 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #f5e6c1;
      letter-spacing: 0.02em;
    }

    .book-detail .book-author-line {
      margin: 0 0 10px;
      color: #d4a55a;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .book-detail .book-bio {
      margin: 0 0 12px;
      font-size: 14.5px;
      color: rgba(232, 217, 184, 0.82);
      line-height: 1.7;
    }

    .chapter-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chapter-list button {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: rgba(50, 35, 22, 0.5);
      border: 1px solid rgba(190, 145, 80, 0.22);
      border-radius: 8px;
      cursor: pointer;
      color: #e8d9b8;
      font: inherit;
      font-size: 15px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .chapter-list button:hover {
      background: rgba(214,170,95,0.14);
      border-color: var(--gold);
      transform: translateX(3px);
    }

    .chapter-list .chapter-num {
      display: inline-block;
      width: 32px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    .chapter-list .chapter-title {
      font-weight: 500;
      color: #f0e1bd;
    }

    .book-detail .back {
      margin-top: 6px;
      background: rgba(93, 57, 34, 0.85);
      color: #fff4dd;
      border: 1px solid rgba(190, 145, 80, 0.3);
    }

    .book-detail .back:hover {
      background: rgba(120, 75, 45, 0.95);
      border-color: var(--gold);
    }

    .chapter-reader h3 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #f5e6c1;
      letter-spacing: 0.01em;
    }

    .chapter-reader .chapter-tag {
      margin: 0 0 20px;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 500;
    }

    .chapter-reader .chapter-body {
      font-size: 16px;
      line-height: 1.95;
      color: #ece0c2;
      max-height: 58vh;
      overflow-y: auto;
      padding-right: 12px;
      letter-spacing: 0.01em;
    }

    .chapter-reader .chapter-body p {
      margin: 0 0 18px;
    }

    .chapter-reader .chapter-body p strong {
      color: #f5e6c1;
      font-weight: 600;
    }

    .chapter-reader .chapter-body p em {
      color: #e8c987;
      font-style: italic;
    }

    .chapter-reader .chapter-body h1,
    .chapter-reader .chapter-body h2 {
      font-size: 19px;
      color: #f5e6c1;
      margin: 24px 0 12px;
      letter-spacing: 0.02em;
    }

    .chapter-reader .chapter-body blockquote {
      margin: 0 0 22px;
      padding: 14px 18px;
      border-left: 3px solid var(--gold);
      background: rgba(214,170,95,0.08);
      color: #f0dcae;
      font-style: italic;
      border-radius: 0 6px 6px 0;
    }

    .chapter-reader .chapter-body::-webkit-scrollbar { width: 10px; }
    .chapter-reader .chapter-body::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    .chapter-reader .chapter-body::-webkit-scrollbar-thumb {
      background: rgba(190,145,80,0.35);
      border-radius: 5px;
    }
    .chapter-reader .chapter-body::-webkit-scrollbar-thumb:hover {
      background: rgba(214,170,95,0.55);
    }

    .chapter-reader .reader-nav {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(190,145,80,0.18);
      flex-wrap: wrap;
    }

    @media (max-width: 760px) {
      .book-detail-head { grid-template-columns: 100px 1fr; gap: 14px; margin-bottom: 18px; }
      .book-detail h3 { font-size: 19px; }
      .chapter-reader h3 { font-size: 22px; }
      .chapter-reader .chapter-body { max-height: 55vh; font-size: 15px; line-height: 1.85; }
      .chapter-list button { padding: 12px 14px; font-size: 14.5px; }
    }

    .landmark-detail .era-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(214,170,95,0.14);
      border: 1px solid rgba(214,170,95,0.45);
      border-radius: 999px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.18em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .landmark-detail h3 {
      margin: 0 0 6px;
      font-size: 26px;
      color: #f5e6c1;
    }

    .landmark-detail .landmark-subtitle {
      margin: 0 0 18px;
      font-size: 13px;
      color: #d4a55a;
      letter-spacing: 0.08em;
      font-style: italic;
    }

    .landmark-hero {
      margin: 0 0 18px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(190,145,80,0.25);
    }

    .landmark-hero-image {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      display: block;
      background: #0e0805;
    }

    .landmark-hero-caption {
      padding: 10px 14px;
      font-size: 12px;
      color: rgba(232, 217, 184, 0.65);
      line-height: 1.6;
      font-style: italic;
      border-top: 1px solid rgba(190,145,80,0.15);
    }

    .landmark-proved {
      margin: 0 0 22px;
      padding: 14px 18px;
      background: rgba(214,170,95,0.08);
      border-left: 3px solid var(--gold);
      border-radius: 0 6px 6px 0;
      color: #f0dcae;
      font-size: 15px;
      line-height: 1.75;
    }

    .landmark-proved::before {
      content: "證明了什麼 · ";
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 0.12em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .landmark-connect {
      display: inline-block;
      margin-top: 6px;
      padding: 10px 16px;
      background: rgba(50, 35, 22, 0.6);
      border: 1px solid rgba(190, 145, 80, 0.35);
      border-radius: 6px;
      color: #f0e1bd;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .landmark-connect:hover {
      background: rgba(214,170,95,0.14);
      border-color: var(--gold);
    }

    .landmark-connect::before {
      content: "↗ ";
      color: var(--gold);
    }

    @media (max-width: 760px) {
      .landmark-detail h3 { font-size: 21px; }
      .landmark-hero-image { max-height: 240px; }
      .landmark-proved { font-size: 14px; padding: 12px 14px; }
    }

    .touch-controls {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: none;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px 52px;
      gap: 6px;
      z-index: 10;
    }

    .touch-controls button {
      min-width: 52px;
      min-height: 52px;
      padding: 0;
      font-size: 20px;
      touch-action: none;
    }

    .touch-controls .up { grid-column: 2; grid-row: 1; }
    .touch-controls .left { grid-column: 1; grid-row: 2; }
    .touch-controls .right { grid-column: 3; grid-row: 2; }
    .touch-controls .down { grid-column: 2; grid-row: 3; }

    #interactTouch {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      display: none;
      min-width: 74px;
      min-height: 74px;
      border-radius: 50%;
      z-index: 10;

  <script>
    const STORAGE_KEY = "walking_wisdom_progress";

    const hint = document.getElementById("hint");

    const dialogueBody = document.getElementById("dialogueBody");
    const iframeTitle = document.getElementById("iframeTitle");
    const closeIframe = document.getElementById("closeIframe");
    const interactTouch = document.getElementById("interactTouch");

    const state = {
      scene: "world",
      assetsReady: false,
      images: {},
      worldZones: null,
      cafeEntities: null,
      collision: null,
      props: null,
      npcFreeze: false,
      nextNpcChatAt: 18,
      activeNpcChat: null,
      progress: loadProgress(),
      activeMaster: null,
      dialogues: null,
      iframeTimer: 0,
      keys: new Set(),
      touchDir: null,
      pointer: { x: 0, y: 0 },
      tooltip: null,
      debugCollision: false,
      player: {
        x: 500,
        y: 675,
        dir: "down",
        moving: false,
        frame: 0,
        frameTime: 0,
        path: [],
        autoInteract: null
      }
    };

    const DIRS = {
      down: { x: 0, y: 1, row: 0 },
      left: { x: -1, y: 0, row: 1 },
      right: { x: 1, y: 0, row: 2 },
      up: { x: 0, y: -1, row: 3 }
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { version: 1, masters_completed: [], intro_seen: false };
        const parsed = JSON.parse(raw);
        return {
          version: 1,
          masters_completed: Array.isArray(parsed.masters_completed) ? parsed.masters_completed : [],
          intro_seen: Boolean(parsed.intro_seen)
        };
      } catch {
        return { version: 1, masters_completed: [], intro_seen: false };
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    }

    function completeMaster(id) {
      if (!MASTER_ORDER.includes(id)) return;
      if (!state.progress.masters_completed.includes(id)) {
        state.progress.masters_completed.push(id);
        state.progress.masters_completed.sort((a, b) => MASTER_ORDER.indexOf(a) - MASTER_ORDER.indexOf(b));
      }
      saveProgress();
      hint.textContent = `${BOOK_LABELS[id]} 已放上旅程書架。`;
    }

    function image(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function json(src) {
      const res = await fetch(src);
      return res.json();
    }

    async function boot() {
      const params = new URLSearchParams(location.search);
      const completed = params.get("completed");
      if (completed) {
        completeMaster(completed);
        history.replaceState(null, "", location.pathname);
      }
      if (params.get("debug") === "collision") state.debugCollision = true;

      const [worldZones, cafeEntities, collision, props, dialogues, books, landmarks, atelierEntities, atelierCollision] = await Promise.all([
        json("data/world-zones.json"),
        json("data/cafe-entities.json"),
        json("data/cafe-collision.json"),
        json("data/cafe-props.json"),
        json("data/dialogues.json"),
        json("data/books.json").catch(() => ({})),
        json("data/landmarks.json").catch(() => ({})),
        json("data/atelier-entities.json").catch(() => null),
        json("data/atelier-collision.json").catch(() => null)
      ]);
      state.worldZones = worldZones;
      state.cafeEntities = cafeEntities;
      state.cafeCollision = collision;
      state.collision = collision;
      state.atelierEntities = atelierEntities;
      state.atelierCollision = atelierCollision;
      state.props = props;
      state.dialogues = dialogues;
      state.books = books;
      state.landmarks = landmarks;
      state.landmarkNear = null;
      state.doorNear = null;
      state.objectNear = null;
      state.footprints = [];

      const imageEntries = [
        ["world", "assets/maps/world-map.png"],
        ["cafe", "assets/maps/cafe-base.png"],
        ["atelier", "assets/maps/atelier-base.png"],
        ["player", "assets/sprites/player/traveler-walk-4x4.png"],
        ...props.bookshelf_states.map((src, i) => [`bookshelf${i}`, src]),
        ...cafeEntities.masters.map((m) => [m.id, m.sprite]),
        ...cafeEntities.masters.map((m) => [`walk_${m.id}`, m.walk_sprite]),
        ...cafeEntities.masters.map((m) => [`avatar_${m.id}`, m.avatar])
      ];
      const loaded = await Promise.all(imageEntries.map(async ([key, src]) => [key, await image(src)]));
      state.images = Object.fromEntries(loaded);
      state.assetsReady = true;

      const spawn = cafeEntities.player_spawn;
      state.player.x = spawn.x;
      state.player.y = spawn.y;
      initNpcAi();

      if (!state.progress.intro_seen) introModal.classList.add("show");
      requestAnimationFrame(loop);
    }

    function toWorldPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((event.clientX - rect.left) / rect.width) * canvas.width,
        y: ((event.clientY - rect.top) / rect.height) * canvas.height
      };
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function rectContains(rect, x, y, pad = 0) {
      return x >= rect.x - pad && x <= rect.x + rect.w + pad && y >= rect.y - pad && y <= rect.y + rect.h + pad;
    }

    function isBlocked(x, y) {
      const bounds = state.collision.walk_bounds;
      if (!rectContains(bounds, x, y)) return true;
      return state.collision.blocked_rects.some((rect) => rectContains(rect, x, y));
    }

    function canMoveTo(x, y) {
      const footPad = 13;
      return !isBlocked(x, y) && !isBlocked(x - footPad, y) && !isBlocked(x + footPad, y) && !isBlocked(x, y - 8);
    }

    function initNpcAi() {
      state.cafeEntities.masters.forEach((master, index) => {
        master.position = nearestWalkable(master.position);
        master.ai = {
          x: master.position.x,
          y: master.position.y,
          dir: "down",
          frame: 0,
          frameTime: 0,
          path: [],
          moving: false,
          idleTime: 1 + Math.random() * 2 + index * 0.15,
          highlighted: false,
          chatting: false,
          bubble: "",
          bubbleTime: 0
        };
      });
    }

    function nearestWalkable(point) {
      if (canMoveTo(point.x, point.y)) return point;
      for (let r = 16; r <= 160; r += 16) {
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
          const p = { x: point.x + Math.cos(a) * r, y: point.y + Math.sin(a) * r };
          if (canMoveTo(p.x, p.y)) return p;
        }
      }
      return { x: state.player.x, y: state.player.y };
    }

    function findPath(start, target) {
      const tile = state.collision.tile_size || 32;
      const cols = Math.ceil(canvas.width / tile);
      const rows = Math.ceil(canvas.height / tile);
      const toCell = (p) => ({
        x: Math.max(0, Math.min(cols - 1, Math.floor(p.x / tile))),
        y: Math.max(0, Math.min(rows - 1, Math.floor(p.y / tile)))
      });
      const toPoint = (c) => ({ x: c.x * tile + tile / 2, y: c.y * tile + tile / 2 });
      const startCell = toCell(start);
      const targetCell = toCell(nearestWalkable(target));
      const key = (c) => `${c.x},${c.y}`;
      const walkable = (c) => c.x >= 0 && c.y >= 0 && c.x < cols && c.y < rows && canMoveTo(...Object.values(toPoint(c)));
      const open = [startCell];
      const came = new Map();
      const g = new Map([[key(startCell), 0]]);
      const f = new Map([[key(startCell), Math.abs(startCell.x - targetCell.x) + Math.abs(startCell.y - targetCell.y)]]);
      const closed = new Set();

      while (open.length) {
        open.sort((a, b) => (f.get(key(a)) || Infinity) - (f.get(key(b)) || Infinity));
        const current = open.shift();
        const currentKey = key(current);
        if (current.x === targetCell.x && current.y === targetCell.y) {
          const cells = [current];
          let cursor = currentKey;
          while (came.has(cursor)) {
            const prev = came.get(cursor);
            cells.unshift(prev);
            cursor = key(prev);
          }
          return cells.slice(1).map(toPoint);
        }
        closed.add(currentKey);
        for (const n of [
          { x: current.x + 1, y: current.y },
          { x: current.x - 1, y: current.y },
          { x: current.x, y: current.y + 1 },
          { x: current.x, y: current.y - 1 }
        ]) {
          const nKey = key(n);
          if (closed.has(nKey) || !walkable(n)) continue;
          const tentative = (g.get(currentKey) || 0) + 1;
          if (!open.some((c) => key(c) === nKey)) open.push(n);
          if (tentative >= (g.get(nKey) || Infinity)) continue;
          came.set(nKey, current);
          g.set(nKey, tentative);
          f.set(nKey, tentative + Math.abs(n.x - targetCell.x) + Math.abs(n.y - targetCell.y));
        }
      }
      return [nearestWalkable(target)];
    }

    function enterCafe(spawnAtDoor) {
      const prev = state.scene;
      state.scene = "cafe";
      state.collision = state.cafeCollision;
      backWorldBtn.hidden = false;
      backWorldBtn.textContent = "返回世界地圖";
      if (spawnAtDoor && prev === "atelier" && state.cafeEntities.doors) {
        const d = state.cafeEntities.doors.find((x) => x.id === "to_atelier");
        if (d && d.approach) {
          state.player.x = d.approach.x;
          state.player.y = d.approach.y;
        }
      } else {
        const spawn = state.cafeEntities.player_spawn;
        state.player.x = spawn.x;
        state.player.y = spawn.y;
      }
      state.player.path = [];
      state.player.autoInteract = null;
      state.footprints = [];
      const lmCafeCount = countLandmarksInScene("cafe");
      hint.textContent = lmCafeCount > 0
        ? `走近智者按 Space 對話 · 咖啡店裡還有 ${lmCafeCount} 個金色光點（彩蛋）· 上方門通往智者工作室。`
        : "走近智者，按 Space / Enter 或點擊 NPC 開始對話。";
    }

    function enterAtelier() {
      if (!state.atelierEntities || !state.atelierCollision) {
        hint.textContent = "工作室還沒準備好。";
        return;
      }
      state.scene = "atelier";
      state.collision = state.atelierCollision;
      backWorldBtn.hidden = false;
      backWorldBtn.textContent = "← 回咖啡店";
      const spawn = state.atelierEntities.player_spawn;
      state.player.x = spawn.x;
      state.player.y = spawn.y;
      state.player.path = [];
      state.player.autoInteract = null;
      state.footprints = [];
      state.bookshelfNear = false;
      state.landmarkNear = null;
      state.doorNear = null;
      state.objectNear = null;
      const lmAtelierCount = countLandmarksInScene("atelier");
      hint.textContent = `智者工作室 · ${lmAtelierCount} 個歷史里程碑藏在裡面 · 中間走道有發光腳印。`;
    }

    function enterWorld() {
      state.scene = "world";
      backWorldBtn.hidden = true;
      hint.textContent = "點擊慢慢走咖啡館進入。";
    }

    function countLandmarksInScene(scene) {
      if (!state.landmarks) return 0;
      return Object.values(state.landmarks).filter((l) => (l.scene || "cafe") === scene).length;
    }

    function masterAt(point) {
      return state.cafeEntities.masters.find((m) => dist(point, masterPoint(m)) < 62);
    }

    function nearbyMaster() {
      return state.cafeEntities.masters.find((m) => dist(state.player, masterPoint(m)) < 92);
    }

    function nearbyBookshelf() {
      const box = state.cafeEntities.bookshelf;
      if (!box) return false;
      const px = state.player.x;
      const py = state.player.y;
      const cx = Math.max(box.x, Math.min(px, box.x + box.w));
      const cy = Math.max(box.y, Math.min(py, box.y + box.h));
      return Math.hypot(px - cx, py - cy) < 90;
    }

    function nearbyLandmark() {
      if (!state.landmarks) return null;
      const px = state.player.x;
      const py = state.player.y;
      let best = null;
      let bestD = Infinity;
      for (const id of Object.keys(state.landmarks)) {
        const lm = state.landmarks[id];
        if ((lm.scene || "cafe") !== state.scene) continue;
        if (!lm.location) continue;
        const r = lm.trigger_radius || 70;
        const d = Math.hypot(px - lm.location.x, py - lm.location.y);
        if (d < r && d < bestD) {
          best = lm;
          bestD = d;
        }
      }
      return best;
    }

    function nearbyDoor() {
      const ents = state.scene === "cafe" ? state.cafeEntities
                  : state.scene === "atelier" ? state.atelierEntities : null;
      if (!ents || !ents.doors) return null;
      const px = state.player.x;
      const py = state.player.y;
      for (const d of ents.doors) {
        if (rectContains(d, px, py, 28)) return d;
      }
      return null;
    }

    function interactDoor(door) {
      if (!door) door = nearbyDoor();
      if (!door) return;
      if (door.unlock_min_masters && state.progress.masters_completed.length < door.unlock_min_masters) {
        hint.textContent = door.locked_hint || "這扇門還沒開。";
        return;
      }
      if (door.target_scene === "atelier") enterAtelier();
      else if (door.target_scene === "cafe") enterCafe(true);
    }

    function nearbyObject() {
      if (state.scene !== "atelier" || !state.atelierEntities || !state.atelierEntities.objects) return null;
      const px = state.player.x;
      const py = state.player.y;
      let best = null;
      let bestD = Infinity;
      for (const o of state.atelierEntities.objects) {
        const r = o.trigger_radius || 60;
        const d = Math.hypot(px - o.x, py - o.y);
        if (d < r && d < bestD) {
          best = o;
          bestD = d;
        }
      }
      return best;
    }

    const WEEKLY_CHALLENGES = [
      "本週挑戰：今天找一段你從沒走過的小巷，慢慢走，不滑手機。",
      "本週挑戰：下班少搭一站地鐵，改走過去。3 公里左右。",
      "本週挑戰：跟家人約一起走 30 分鐘，誰都不准戴耳機。",
      "本週挑戰：赤腳在草地上走 5 分鐘，感受腳底的承重。",
      "本週挑戰：上樓梯時試試「腳跟先觸地、腳掌滾過去」（Perry 第二章）。",
      "本週挑戰：明天走路時把手插在口袋——你會發現平常多用力在擺手。",
      "本週挑戰：走 30 分鐘不講話、不聽音樂、不想事情，只看路。",
      "本週挑戰：找一條從家走到咖啡店的「最美路線」，不是最短的，是最美的。"
    ];

    function openBlackboard() {
      const idx = Math.floor((Date.now() / (1000 * 60 * 60 * 24 * 3)) % WEEKLY_CHALLENGES.length);
      const challenge = WEEKLY_CHALLENGES[idx];
      iframeTitle.textContent = "黑板 · 本週步行挑戰";
      iframeModal.classList.add("show");
      state.npcFreeze = true;
      state.openingShelf = true;
      const wrap = document.createElement("div");
      wrap.className = "book-detail landmark-detail";
      const era = document.createElement("span");
      era.className = "era-badge";
      era.textContent = "Step by Step Cafe · 後廳";
      wrap.appendChild(era);
      const h = document.createElement("h3");
      h.textContent = "本週步行挑戰";
      wrap.appendChild(h);
      const proved = document.createElement("div");
      proved.className = "landmark-proved";
      proved.textContent = challenge;
      proved.style.fontSize = "17px";
      wrap.appendChild(proved);
      const body = document.createElement("div");
      body.className = "chapter-body";
      body.innerHTML = "<p>智者們每幾天會換一次題目。完成了不用回報——身體會記得。</p><p>下次來咖啡店記得告訴我們今天走了哪。</p>";
      wrap.appendChild(body);
      const close = document.createElement("button");
      close.type = "button";
      close.className = "back";
      close.style.marginTop = "18px";
      close.textContent = "關閉";
      close.addEventListener("click", () => {
        iframeModal.classList.remove("show");
        state.npcFreeze = false;
        state.openingShelf = false;
      });
      wrap.appendChild(close);
      dialogueBody.innerHTML = "";
      dialogueBody.appendChild(wrap);
    }

    function interactObject(obj) {
      if (!obj) obj = nearbyObject();
      if (!obj) return;
      if (obj.type === "blackboard") { openBlackboard(); return; }
      if (obj.phase === 3) {
        hint.textContent = `${obj.label} — Phase 3 才開放，敬請期待。`;
        return;
      }
    }

    function interactLandmark(lm) {
      const landmark = lm || nearbyLandmark();
      if (!landmark) return;
      iframeTitle.textContent = "學習角落";
      iframeModal.classList.add("show");
      state.npcFreeze = true;
      state.openingShelf = true;
      renderLandmarkDetail(landmark.id);
    }

    function renderLandmarkDetail(landmarkId) {
      const lm = state.landmarks && state.landmarks[landmarkId];
      if (!lm) return;

      const wrap = document.createElement("div");
      wrap.className = "book-detail landmark-detail";

      if (lm.era_label) {
        const era = document.createElement("span");
        era.className = "era-badge";
        era.textContent = lm.era_label;
        wrap.appendChild(era);
      }

      const heading = document.createElement("h3");
      heading.textContent = lm.title || "";
      wrap.appendChild(heading);

      if (lm.subtitle) {
        const sub = document.createElement("p");
        sub.className = "landmark-subtitle";
        sub.textContent = lm.subtitle;
        wrap.appendChild(sub);
      }

      if (lm.image_url) {
        const hero = document.createElement("figure");
        hero.className = "landmark-hero";
        const img = document.createElement("img");

    function updateFootprintTrail(dt) {
      if (state.scene !== "atelier" || !state.atelierEntities) return;
      const zone = state.atelierEntities.footprint_zone;
      if (!zone) return;
      // age + cull
      for (const fp of state.footprints) fp.age += dt;
      state.footprints = state.footprints.filter((fp) => fp.age < 3);
      // emit when player is moving inside zone
      if (state.player.moving && rectContains(zone, state.player.x, state.player.y, 8)) {
        const last = state.footprints[state.footprints.length - 1];
        const dx = last ? state.player.x - last.x : 99;
        const dy = last ? state.player.y - last.y : 99;
        if (!last || Math.hypot(dx, dy) > 22) {
          state.footprints.push({
            x: state.player.x + (Math.random() - 0.5) * 4,
            y: state.player.y + 4 + (Math.random() - 0.5) * 3,
            age: 0,
            side: state.footprints.length % 2
          });
        }
      }
    }

    function mdToHtml(md) {
      const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const lines = md.split(/\r?\n/);
      const out = [];
      let para = [];
      const flush = () => {
        if (!para.length) return;
        let text = escape(para.join(" ")).trim();
        text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");
        out.push(`<p>${text}</p>`);
        para = [];
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { flush(); continue; }
        if (line.startsWith("# ")) { flush(); out.push(`<h2>${escape(line.slice(2))}</h2>`); continue; }
        if (line.startsWith("## ")) { flush(); out.push(`<h2>${escape(line.slice(3))}</h2>`); continue; }
        if (line.startsWith("> ")) {
          flush();
          let bq = escape(line.slice(2));
          bq = bq.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
          out.push(`<blockquote>${bq}</blockquote>`);
          continue;
        }
        para.push(line);
      }
      flush();
      return out.join("\n");
    }

    function renderQuestion(master, dialogue, questionMap, question, session) {
      const content = document.getElementById("qaContent");
      if (!content) return;

      const bioImg = document.getElementById("qaBioImage");
      if (bioImg && question.image) {
        bioImg.src = question.image;
      }

      session.currentNodeId = question.id;
      updatePills(session);

      const wrap = document.createElement("div");

      const tag = document.createElement("p");
      tag.className = "qa-cafe-tag";
      tag.textContent = "STEP BY STEP CAFE";

      const text = document.createElement("p");
      text.className = "qa-question";

      const opts = document.createElement("div");
      opts.className = "qa-options";
      for (const option of question.options) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = option;
        btn.addEventListener("click", () => {
          const correct = option === question.answer;
          for (const sibling of opts.querySelectorAll("button")) {
            sibling.disabled = true;
            if (sibling.textContent === question.answer) sibling.classList.add("correct");
          }
          if (!correct) btn.classList.add("wrong");
          session.answered += 1;
          if (correct) session.correct += 1; else session.wrong += 1;
          updatePills(session);
          showFeedback(master, dialogue, questionMap, question, correct, session);
        });
        opts.appendChild(btn);

      wrap.appendChild(opts);

      content.innerHTML = "";

      feedback.appendChild(head);
      feedback.appendChild(body);
      content.appendChild(feedback);

      const actions = document.createElement("div");
      actions.className = "qa-actions";

      const nextId = correct ? question.next_correct : question.next_wrong;
      const nextQuestion = nextId != null ? questionMap.get(nextId) : null;

      if (correct && !nextQuestion) {
        completeMaster(master.id);

      state.openingShelf = false;
      if (wasShelf) return;
      const m = state.activeMaster;
      if (m && !state.progress.masters_completed.includes(m.id)) {

    function update(dt) {
      if (!state.assetsReady) return;
      if (state.scene !== "cafe" && state.scene !== "atelier") return;
      if (state.scene === "cafe") {
        updateNpcs(dt);
        updateBookshelfHint();
        updateLandmarkHint();
        updateDoorHint();
      } else {
        updateLandmarkHint();
        updateDoorHint();
        updateObjectHint();
        updateFootprintTrail(dt);
      }
      const speed = 150;
      let dx = 0;
      let dy = 0;
      if (state.keys.has("arrowup") || state.keys.has("w") || state.touchDir === "up") dy -= 1;
      if (state.keys.has("arrowdown") || state.keys.has("s") || state.touchDir === "down") dy += 1;
      if (state.keys.has("arrowleft") || state.keys.has("a") || state.touchDir === "left") dx -= 1;
      if (state.keys.has("arrowright") || state.keys.has("d") || state.touchDir === "right") dx += 1;

      if (dx || dy) {
        state.player.path = [];
        state.player.autoInteract = null;
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        movePlayer(dx * speed * dt, dy * speed * dt);
      } else if (state.player.path.length) {
        const target = state.player.path[0];
        const vx = target.x - state.player.x;
        const vy = target.y - state.player.y;
        const len = Math.hypot(vx, vy);
        if (len < 4) {
          state.player.path.shift();
          if (!state.player.path.length && state.player.autoInteract) {
            const master = state.player.autoInteract;
            state.player.autoInteract = null;
            startTalk(master);
          }
        } else {
          movePlayer((vx / len) * speed * dt, (vy / len) * speed * dt);
        }
      } else {
        state.player.moving = false;
      }

      if (state.player.moving) {
        state.player.frameTime += dt;
        if (state.player.frameTime > 0.14) {
          state.player.frame = (state.player.frame + 1) % 4;
          state.player.frameTime = 0;
        }
      } else {
        state.player.frame = 0;
      }
    }

    function updateNpcs(dt) {
      const frozenByModal = state.npcFreeze || talkModal.classList.contains("show") || iframeModal.classList.contains("show") || introModal.classList.contains("show");
      updateNpcChat(dt, frozenByModal);
      for (const master of state.cafeEntities.masters) {
        updateSingleNpc(master, dt, frozenByModal);
      }
    }

    function updateSingleNpc(master, dt, frozenByModal) {
      const ai = master.ai;
      if (!ai) return;
      const playerDistance = dist(state.player, ai);
      ai.highlighted = playerDistance < 120;
      if (ai.highlighted) {
        if (ai.chatting) endNpcChat();
        ai.path = [];
        ai.moving = false;
        ai.dir = directionToward(ai, state.player);
        return;
      }
      if (frozenByModal || ai.chatting) {
        ai.moving = false;
        return;
      }

      if (ai.path.length) {
        const target = ai.path[0];
        const vx = target.x - ai.x;
        const vy = target.y - ai.y;
        const len = Math.hypot(vx, vy);
        if (len < 3) {
          ai.path.shift();
          if (!ai.path.length) {
            ai.moving = false;
            ai.idleTime = 1 + Math.random() * 2;
          }
        } else {
          moveNpc(master, (vx / len) * 75 * dt, (vy / len) * 75 * dt);
        }
      } else {
        ai.moving = false;
        ai.idleTime -= dt;
        if (ai.idleTime <= 0) {
          if (Math.random() < 0.28) ai.dir = randomDir();
          const target = randomPointInZone(master.roam_zone);
          ai.path = findPath(ai, target).slice(0, 14);
          if (!ai.path.length) ai.idleTime = 1 + Math.random() * 2;
        }
      }

      if (ai.moving) {
        ai.frameTime += dt;
        if (ai.frameTime > 0.18) {
          ai.frame = (ai.frame + 1) % 4;
          ai.frameTime = 0;
        }
      } else {
        ai.frame = 0;
      }
    }

    function moveNpc(master, dx, dy) {
      const ai = master.ai;
      const nextX = ai.x + dx;
      const nextY = ai.y + dy;
      if (Math.abs(dx) > Math.abs(dy)) ai.dir = dx > 0 ? "right" : "left";
      else if (dy !== 0) ai.dir = dy > 0 ? "down" : "up";
      let moved = false;
      if (canMoveTo(nextX, ai.y)) {
        ai.x = nextX;
        moved = true;
      }
      if (canMoveTo(ai.x, nextY)) {
        ai.y = nextY;
        moved = true;
      }
      master.position.x = ai.x;
      master.position.y = ai.y;
      ai.moving = moved;
    }

    function randomPointInZone(zone) {
      for (let i = 0; i < 18; i++) {
        const point = {
          x: zone.x + Math.random() * zone.w,
          y: zone.y + Math.random() * zone.h
        };
        if (canMoveTo(point.x, point.y)) return point;
      }
      return nearestWalkable({ x: zone.x + zone.w / 2, y: zone.y + zone.h / 2 });
    }

    function randomDir() {
      return ["down", "left", "right", "up"][Math.floor(Math.random() * 4)];
    }

    function directionToward(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "right" : "left";
      return dy > 0 ? "down" : "up";
    }

    function updateNpcChat(dt, frozenByModal) {
      if (state.activeNpcChat) {
        state.activeNpcChat.time -= dt;
        const [a, b] = state.activeNpcChat.masters;
        if (dist(state.player, a.ai) < 120 || dist(state.player, b.ai) < 120 || state.activeNpcChat.time <= 0 || frozenByModal) {
          endNpcChat();
        }
        return;
      }
      if (frozenByModal) return;
      state.nextNpcChatAt -= dt;
      if (state.nextNpcChatAt > 0) return;
      state.nextNpcChatAt = 15 + Math.random() * 10;
      const candidates = [];
      const masters = state.cafeEntities.masters;
      for (let i = 0; i < masters.length; i++) {
        for (let j = i + 1; j < masters.length; j++) {
          const a = masters[i];
          const b = masters[j];
          if (a.ai.highlighted || b.ai.highlighted || a.ai.path.length || b.ai.path.length) continue;
          const d = dist(a.ai, b.ai);
          if (d < 210) candidates.push([a, b, d]);
        }
      }
      if (!candidates.length) return;
      candidates.sort((a, b) => a[2] - b[2]);
      const [a, b] = candidates[Math.min(candidates.length - 1, Math.floor(Math.random() * 3))];
      startNpcChat(a, b);
    }

    function startNpcChat(a, b) {
      const bubble = npcChatBubble(a.id, b.id);
      a.ai.path = [];
      b.ai.path = [];
      a.ai.chatting = true;
      b.ai.chatting = true;
      a.ai.bubble = bubble;
      b.ai.bubble = bubble;
      a.ai.dir = directionToward(a.ai, b.ai);
      b.ai.dir = directionToward(b.ai, a.ai);
      state.activeNpcChat = { masters: [a, b], time: 4 + Math.random() * 2 };
    }

    function endNpcChat() {
      if (!state.activeNpcChat) return;
      for (const master of state.activeNpcChat.masters) {
        master.ai.chatting = false;
        master.ai.bubble = "";
        master.ai.idleTime = 1 + Math.random() * 2;
      }
      state.activeNpcChat = null;
    }

    function npcChatBubble(a, b) {
      const pair = [a, b].sort().join("+");
      const bubbles = {
        "cavagna+lieberman": "🦴",
        "perry+studenski": "👣",
        "bernstein+roberts": "⚡"
      };
      return bubbles[pair] || "💭";
    }

    function movePlayer(dx, dy) {
      const nextX = state.player.x + dx;
      const nextY = state.player.y + dy;
      if (Math.abs(dx) > Math.abs(dy)) state.player.dir = dx > 0 ? "right" : "left";
      else if (dy !== 0) state.player.dir = dy > 0 ? "down" : "up";
      let moved = false;
      if (canMoveTo(nextX, state.player.y)) {
        state.player.x = nextX;
        moved = true;
      }
      if (canMoveTo(state.player.x, nextY)) {
        state.player.y = nextY;
        moved = true;
      }
      state.player.moving = moved;
    }

    function drawImageCover(img) {
      if (!img) return;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    function drawWorld() {
      drawImageCover(state.images.world);
      const cafe = state.worldZones.locations[0];
      ctx.save();
      ctx.strokeStyle = "rgba(255, 244, 221, 0.95)";
      ctx.lineWidth = 4;
      ctx.fillStyle = "rgba(242, 196, 109, 0.22)";
      ctx.beginPath();
      ctx.arc(cafe.x, cafe.y, cafe.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      drawLabel(cafe.name, cafe.x, cafe.y - 104, "#fff4dd", "#5d3922");
      ctx.restore();
    }

    function drawCafe() {
      drawImageCover(state.images.cafe);
      drawBookshelf();
      drawDoors(state.cafeEntities && state.cafeEntities.doors);
      drawLandmarks();
      const drawables = [
        ...state.cafeEntities.masters.map((m) => ({ type: "master", y: masterPoint(m).y, data: m })),
        { type: "player", y: state.player.y, data: state.player }
      ].sort((a, b) => a.y - b.y);
      for (const item of drawables) {
        if (item.type === "master") drawMaster(item.data);
        else drawPlayer();
      }
      drawBookTooltip();
      if (state.debugCollision) drawDebugCollision();
    }

    function drawDoors(doors) {
      if (!doors) return;
      const completed = state.progress.masters_completed.length;
      for (const d of doors) {
        const cx = d.x + d.w / 2;
        const cy = d.y + d.h / 2;
        const locked = d.unlock_min_masters && completed < d.unlock_min_masters;
        const near = state.doorNear && state.doorNear.id === d.id;
        ctx.save();
        // arched glow
        const t = (performance.now() / 1100) % 1;
        const pulse = 0.5 + Math.sin(t * Math.PI * 2) * 0.5;
        ctx.shadowColor = locked ? "rgba(120, 90, 60, 0.7)"
                                 : (near ? "rgba(245, 209, 141, 0.95)" : "rgba(214, 165, 90, 0.7)");
        ctx.shadowBlur = locked ? 8 : 18 + pulse * 10;
        ctx.fillStyle = locked ? "rgba(60, 45, 30, 0.55)" : "rgba(245, 209, 141, 0.32)";
        ctx.strokeStyle = locked ? "rgba(120, 90, 60, 0.85)"
                                 : (near ? "#f5d18d" : "#d4a55a");
        ctx.lineWidth = 2;
        // arch shape
        ctx.beginPath();
        ctx.moveTo(d.x, d.y + d.h);
        ctx.lineTo(d.x, d.y + d.h * 0.45);
        ctx.quadraticCurveTo(d.x, d.y, d.x + d.w / 2, d.y);
        ctx.quadraticCurveTo(d.x + d.w, d.y, d.x + d.w, d.y + d.h * 0.45);
        ctx.lineTo(d.x + d.w, d.y + d.h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        drawLabel(locked ? `🔒 ${d.label}` : d.label, cx, d.y - 8,
          near ? "#f5d18d" : "#ead3aa",
          near ? "#5c3922" : "rgba(42, 27, 18, 0.78)",
          11);
      }
    }

    function drawAtelier() {
      const ents = state.atelierEntities;
      if (!ents) {
        ctx.fillStyle = "#1a120c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawLabel("工作室載入中…", canvas.width / 2, canvas.height / 2);
        return;
      }
      // 1. real artwork background
      if (state.images.atelier) {
        drawImageCover(state.images.atelier);
      } else {
        ctx.fillStyle = "#2a1c12";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      // 2. footprint trail (in the brass-bordered walkway)
      drawFootprints();
      // 3. doors + landmarks + objects + player
      drawDoors(ents.doors);
      drawLandmarks();
      drawAtelierObjects();
      drawPlayer();
      drawBookTooltip();
      if (state.debugCollision) drawDebugCollision();
    }

    function drawFootprints() {
      for (const fp of state.footprints) {
        const opacity = Math.max(0, 1 - fp.age / 3);
        ctx.save();
        ctx.shadowColor = `rgba(245, 209, 141, ${opacity * 0.8})`;
        ctx.shadowBlur = 14 * opacity;
        ctx.fillStyle = `rgba(245, 209, 141, ${opacity * 0.85})`;
        ctx.beginPath();
        ctx.ellipse(fp.x + (fp.side ? 6 : -6), fp.y, 5, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawAtelierObjects() {
      const ents = state.atelierEntities;
      if (!ents || !ents.objects) return;
      const nearId = state.objectNear && state.objectNear.id;
      for (const o of ents.objects) {
        const near = o.id === nearId;
        const locked = o.phase === 3;
        ctx.save();
        const t = (performance.now() / 700) % 1;
        const pulse = 4 + Math.sin(t * Math.PI * 2) * 1.5;
        ctx.shadowColor = locked ? "rgba(120, 90, 60, 0.5)"
                                 : (near ? "rgba(245, 209, 141, 0.95)" : "rgba(214, 165, 90, 0.65)");
        ctx.shadowBlur = locked ? 6 : (near ? 22 : 12);
        ctx.fillStyle = locked ? "#5a4a30" : (near ? "#f5d18d" : "#d4a55a");
        ctx.beginPath();
        ctx.arc(o.x, o.y, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        drawLabel(locked ? `🔒 ${o.label}` : o.label, o.x, o.y - 18,
          near ? "#f5d18d" : "#ead3aa",
          near ? "#5c3922" : "rgba(42, 27, 18, 0.78)",
          11);
      }
    }

    function drawLandmarks() {
      if (!state.landmarks) return;
      const nearId = state.landmarkNear && state.landmarkNear.id;
      const ids = Object.keys(state.landmarks);
      for (const id of ids) {
        const lm = state.landmarks[id];
        if (!lm.location) continue;
        const near = id === nearId;
        const x = lm.location.x;
        const y = lm.location.y;

        // pulsing gold dot at trigger center
        ctx.save();
        const t = (performance.now() / 600) % 1;
        const pulseR = 6 + Math.sin(t * Math.PI * 2) * 2;
        ctx.shadowColor = near ? "rgba(245, 209, 141, 0.95)" : "rgba(214, 165, 90, 0.75)";
        ctx.shadowBlur = near ? 24 : 14;
        ctx.fillStyle = near ? "#f5d18d" : "#d4a55a";
        ctx.beginPath();
        ctx.arc(x, y, pulseR, 0, Math.PI * 2);
        ctx.fill();
        // inner core
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff4dd";
        ctx.beginPath();
        ctx.arc(x, y, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // label above the dot
        const label = lm.map_label || `${lm.title} · ${lm.year}`;
        drawLabel(label, x, y - 18,
          near ? "#f5d18d" : "#ead3aa",
          near ? "#5c3922" : "rgba(42, 27, 18, 0.78)",
          12);
      }
    }

    function drawDebugCollision() {
      const c = state.collision;
      if (!c) return;
      ctx.save();
      ctx.fillStyle = "rgba(255, 50, 50, 0.32)";
      ctx.strokeStyle = "rgba(255, 80, 80, 0.95)";
      ctx.lineWidth = 2;
      c.blocked_rects.forEach((r, i) => {
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = "#fff";
        ctx.font = "600 14px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(`#${i}`, r.x + 4, r.y + 4);
        ctx.fillStyle = "rgba(255, 50, 50, 0.32)";
      });
      ctx.strokeStyle = "rgba(60, 220, 100, 0.95)";
      ctx.lineWidth = 3;
      const wb = c.walk_bounds;
      ctx.strokeRect(wb.x, wb.y, wb.w, wb.h);
      ctx.fillStyle = "#0f0";
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "600 14px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`player ${Math.round(state.player.x)}, ${Math.round(state.player.y)}`, 56, 224);
      ctx.restore();
    }

    function drawBookshelf() {
      const box = state.cafeEntities.bookshelf;
      const near = state.scene === "cafe" && nearbyBookshelf();
      if (near) {
        ctx.save();
        ctx.strokeStyle = "rgba(245, 209, 141, 0.95)";
        ctx.lineWidth = 3;
        ctx.shadowColor = "rgba(245, 209, 141, 0.7)";
        ctx.shadowBlur = 22;
        ctx.strokeRect(box.x - 2, box.y - 2, box.w + 4, box.h + 4);
        ctx.restore();
      }
      const n = state.progress.masters_completed.length;
      drawLabel(`旅程書架  ${n} / 6`, box.x + box.w / 2, box.label_y,
        near ? "#f5d18d" : "#fff4dd",
        near ? "#5c3922" : "#4f321f");
    }

    function drawBookTooltip() {
      if (!state.tooltip) return;
      drawLabel(state.tooltip.text, state.tooltip.x, state.tooltip.y, "#2a1b12", "#fff4dd");
    }

    function drawMaster(master) {
      const ai = master.ai || { x: master.position.x, y: master.position.y, dir: "down", frame: 0, highlighted: false, bubble: "" };
      const walkImg = state.images[`walk_${master.id}`];
      const staticImg = state.images[master.id];
      const w = 52;
      const h = 88;
      if (walkImg) {
        const row = DIRS[ai.dir].row;
        const col = ai.frame || 0;
        ctx.drawImage(walkImg, col * 64, row * 64, 64, 64, ai.x - 24, ai.y - 50, 48, 48);
      } else if (staticImg) {
        ctx.drawImage(staticImg, ai.x - w / 2, ai.y - h + 14, w, h);
      }
      if (state.progress.masters_completed.includes(master.id)) {
        ctx.fillStyle = "#f2c46d";
        ctx.beginPath();
        ctx.arc(ai.x + 22, ai.y - 72, 7, 0, Math.PI * 2);
        ctx.fill();
      }
      if (ai.bubble) drawSpeechBubble(ai.bubble, ai.x, ai.y - 72);
      const bg = ai.highlighted ? "rgba(92,57,34,0.94)" : "rgba(42,27,18,0.78)";
      const color = ai.highlighted ? "#f2c46d" : "#fff4dd";
      drawLabel(master.name, ai.x, ai.y - h + 2, color, bg, 12);
    }

    function drawSpeechBubble(text, x, y) {
      ctx.save();
      ctx.font = "20px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      roundRect(x - 20, y - 18, 40, 30, 8);
      ctx.fillStyle = "rgba(255,244,221,0.92)";
      ctx.fill();
      ctx.fillStyle = "#2a1b12";
      ctx.fillText(text, x, y - 3);
      ctx.restore();
    }

    function drawPlayer() {
      const img = state.images.player;
      if (!img) return;
      const row = DIRS[state.player.dir].row;
      const col = state.player.frame;
      ctx.drawImage(img, col * 64, row * 64, 64, 64, state.player.x - 24, state.player.y - 50, 48, 48);
    }

    function drawLabel(text, x, y, color = "#fff4dd", bg = "rgba(42,27,18,0.72)", size = 14) {
      ctx.save();
      ctx.font = `600 ${size}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const metrics = ctx.measureText(text);
      const width = Math.min(metrics.width + 18, 260);
      const height = size + 12;
      const left = Math.max(8, Math.min(canvas.width - width - 8, x - width / 2));
      const top = y - height / 2;
      roundRect(left, top, width, height, 7);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.fillStyle = color;
      ctx.fillText(text, left + width / 2, y, width - 12);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function updateTooltip(point) {
      state.tooltip = null;
      if (state.scene !== "cafe") return;
      const box = state.cafeEntities.bookshelf;
      if (!rectContains(box, point.x, point.y)) return;
      const completed = state.progress.masters_completed;
      const slot = Math.floor((point.x - box.x - 10) / 20);
      const id = completed[slot];
      if (id) state.tooltip = { text: BOOK_LABELS[id], x: point.x, y: point.y - 28 };
    }

    function handleCanvasClick(event) {
      const point = toWorldPoint(event);
      if (state.scene === "world") {
        const cafe = state.worldZones.locations[0];
        if (dist(point, cafe) <= cafe.radius) enterCafe();
        return;
      }
      const master = masterAt(point);
      if (master) {
        state.player.path = findPath(state.player, approachPointForMaster(master));
        state.player.autoInteract = master;
      } else if (canMoveTo(point.x, point.y)) {
        state.player.path = findPath(state.player, point);
        state.player.autoInteract = null;
      }
    }

    function approachPointForMaster(master) {
      const p = masterPoint(master);
      const vx = state.player.x - p.x;
      const vy = state.player.y - p.y;
      const len = Math.hypot(vx, vy) || 1;
      return nearestWalkable({ x: p.x + (vx / len) * 58, y: p.y + (vy / len) * 58 });
    }

    canvas.addEventListener("pointerdown", handleCanvasClick);
    canvas.addEventListener("pointermove", (event) => updateTooltip(toWorldPoint(event)));

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " ", "enter"].includes(key)) {
        event.preventDefault();
      }
      if (key === "g") {
        state.debugCollision = !state.debugCollision;
        hint.textContent = `碰撞 debug: ${state.debugCollision ? "ON" : "OFF"}`;
        return;
      }
      if (key === " " || key === "enter") {
        if (state.scene === "cafe") {
          const door = nearbyDoor();
          if (door) { interactDoor(door); return; }
          if (nearbyBookshelf()) { interactBookshelf(); return; }
          const lm = nearbyLandmark();
          if (lm) { interactLandmark(lm); return; }
          const master = nearbyMaster();
          if (master) { startTalk(master); return; }
        } else if (state.scene === "atelier") {
          const door = nearbyDoor();
          if (door) { interactDoor(door); return; }
          const lm = nearbyLandmark();
          if (lm) { interactLandmark(lm); return; }
          const obj = nearbyObject();
          if (obj) { interactObject(obj); return; }
        }
        return;
      }
      state.keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      state.keys.delete(event.key.toLowerCase());
    });

    document.querySelectorAll(".touch-controls button").forEach((button) => {
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        state.touchDir = button.dataset.dir;
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointerup", () => state.touchDir = null);
      button.addEventListener("pointercancel", () => state.touchDir = null);
    });

    interactTouch.addEventListener("click", () => {
      if (state.scene === "cafe") {
        const door = nearbyDoor();
        if (door) { interactDoor(door); return; }
        if (nearbyBookshelf()) { interactBookshelf(); return; }
        const lm = nearbyLandmark();
        if (lm) { interactLandmark(lm); return; }
        const master = nearbyMaster();
        if (master) startTalk(master);
      } else if (state.scene === "atelier") {
        const door = nearbyDoor();
        if (door) { interactDoor(door); return; }
        const lm = nearbyLandmark();
        if (lm) { interactLandmark(lm); return; }
        const obj = nearbyObject();
        if (obj) interactObject(obj);
      }
    });

    startJourneyBtn.addEventListener("click", () => {
      state.progress.intro_seen = true;
      saveProgress();
      introModal.classList.remove("show");
    });

    cancelTalk.addEventListener("click", () => {
      talkModal.classList.remove("show");
      state.npcFreeze = false;
      state.activeMaster = null;
    });

    openDialogue.addEventListener("click", () => {
      const master = state.activeMaster;
      if (!master) return;
      talkModal.classList.remove("show");
      openDialogueExperience(master);
    });

    closeIframe.addEventListener("click", closeDialogueModal);

    backWorldBtn.addEventListener("click", () => {
      if (state.scene === "atelier") enterCafe(true);
      else enterWorld();
    });

    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state.progress = loadProgress();
      introModal.classList.add("show");
      hint.textContent = state.scene === "world" ? "點擊慢慢走咖啡館進入。" : "進度已重置。";
    });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!state.assetsReady) {
        ctx.fillStyle = "#211813";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawLabel("載入中...", canvas.width / 2, canvas.height / 2);
      } else if (state.scene === "world") {
        drawWorld();
      } else if (state.scene === "atelier") {
        drawAtelier();
      } else {
        drawCafe();
      }
      requestAnimationFrame(loop);
    }

    boot();
  </script>
</body>
</html>
