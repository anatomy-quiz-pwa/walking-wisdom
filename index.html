<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>慢慢走 Walking Wisdom</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #fff4dd;
      --ink: #2a1b12;
      --wood: #7a4a27;
      --leaf: #4d7455;
      --gold: #f2c46d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #1d1713;
      color: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255, 244, 221, 0.05), rgba(0, 0, 0, 0.2)),
        #211813;
    }

    canvas {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid rgba(255, 244, 221, 0.18);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.5);
      background: #211813;
      touch-action: none;
    }

    .hud {
      position: fixed;
      left: 12px;
      right: 12px;
      top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .pill,
    button {
      border: 1px solid rgba(255, 244, 221, 0.3);
      border-radius: 8px;
      background: rgba(42, 27, 18, 0.78);
      color: var(--paper);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(8px);
    }

    .pill {
      max-width: min(680px, 72vw);
      padding: 9px 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      min-height: 40px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      pointer-events: auto;
    }

    button:hover { border-color: rgba(242, 196, 109, 0.75); }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(19, 13, 10, 0.58);
      z-index: 20;
    }

    .modal-backdrop.show { display: grid; }

    .modal {
      width: min(760px, 100%);
      border: 1px solid rgba(255, 244, 221, 0.22);
      border-radius: 8px;
      background: rgba(255, 244, 221, 0.96);
      color: var(--ink);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .modal-content {
      padding: 22px;
    }

    .modal-content p {
      margin: 0 0 16px;
      line-height: 1.75;
      font-size: 17px;
    }

    .dialogue-card {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 18px;
      align-items: center;
    }

    .avatar-frame {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #ead3aa;
      border: 1px solid rgba(42, 27, 18, 0.18);
      overflow: hidden;
    }

    .avatar-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }


    .modal-actions button {
      background: #5d3922;
      color: #fff4dd;
    }

    .iframe-modal {
      width: min(1100px, 96vw);
      height: min(760px, 92vh);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #1c1410;
      border-color: rgba(190, 145, 80, 0.22);
    }

    .iframe-head,
    .iframe-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: #16100b;
      color: #d4a55a;
      border-bottom: 1px solid rgba(190, 145, 80, 0.18);
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .iframe-head button {
      background: transparent;
      color: #ead3aa;
      border: 1px solid rgba(190, 145, 80, 0.35);
    }

    .iframe-head button:hover {
      border-color: var(--gold);
      background: rgba(212, 165, 90, 0.12);
    }

    .iframe-foot {
      font-size: 13px;
      justify-content: flex-end;
      flex-wrap: wrap;
      border-bottom: 0;
      border-top: 1px solid rgba(190, 145, 80, 0.18);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .dialogue-body {
      width: 100%;
      height: 100%;
      overflow: auto;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(212, 165, 90, 0.06), transparent 60%),
        #1c1410;
      color: #e8d9b8;
      padding: 26px 32px 32px;
      line-height: 1.75;
    }

    .qa-image {
      display: block;
      max-width: 100%;
      max-height: 280px;
      margin: 0 auto 18px;
      border-radius: 8px;
      object-fit: contain;
    }

    .qa-hero {
      background: rgba(50, 35, 22, 0.4);
      border: 1px solid rgba(190, 145, 80, 0.18);
      border-radius: 14px;
      padding: 22px 26px 18px;
      margin-bottom: 22px;
    }

    .qa-hero-title {
      font-family: "Noto Serif TC", "Songti TC", "Noto Serif", serif;
      color: #d4a55a;
      font-size: 34px;
      letter-spacing: 0.42em;
      margin: 0 0 10px;
      font-weight: 600;
    }

    .qa-hero-sub {
      color: rgba(232, 217, 184, 0.62);
      font-size: 13px;
      margin: 0 0 16px;
      line-height: 1.75;
      letter-spacing: 0.04em;
    }

    .qa-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .qa-pill {
      background: rgba(28, 20, 14, 0.7);
      border: 1px solid rgba(190, 145, 80, 0.22);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      color: #ead3aa;
      letter-spacing: 0.04em;
    }

    .qa-pill .pill-key {
      color: rgba(232, 217, 184, 0.55);
      margin-right: 6px;
    }

    .qa-pill.success {
      background: rgba(45, 74, 53, 0.45);
      border-color: rgba(143, 200, 156, 0.32);
      color: #b6e3bf;
    }

    .qa-pill.success .pill-key {
      color: rgba(182, 227, 191, 0.7);
    }

    .qa-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    .qa-bio {
      background: rgba(50, 35, 22, 0.4);
      border: 1px solid rgba(190, 145, 80, 0.2);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 0;
    }

    .qa-bio-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background: #2a1f17;
      border: 1px solid rgba(190, 145, 80, 0.2);
    }

    .qa-bio-label {
      font-size: 11px;
      letter-spacing: 0.22em;
      color: rgba(232, 217, 184, 0.5);
      text-transform: uppercase;
      margin: 4px 0 0;
    }

    .qa-bio-name {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      color: #d4a55a;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .qa-bio-lines {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.7;
      color: #e0cfa6;
    }

    .qa-bio-lines p {
      margin: 0 0 6px;
    }

    .qa-bio-lines p:last-child {
      margin: 0;
    }

    .qa-bio-title {
      margin: 4px 0 0;
      padding-top: 12px;
      border-top: 1px solid rgba(190, 145, 80, 0.2);
      font-size: 13px;
      color: rgba(232, 217, 184, 0.55);
      font-style: italic;
    }

    .qa-content {
      min-width: 0;
    }

    .qa-cafe-tag {
      font-size: 11px;
      letter-spacing: 0.28em;
      color: rgba(232, 217, 184, 0.5);
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    .qa-question {
      font-size: 19px;
      margin: 0 0 22px;
      color: #f0e0bb;
      line-height: 1.85;
    }

    .qa-options {
      display: grid;
      gap: 12px;
      margin: 0 0 18px;
    }

    .qa-options button {
      text-align: left;
      background: rgba(42, 30, 20, 0.55);
      color: #ebd9b3;
      border: 1px solid rgba(190, 145, 80, 0.25);
      padding: 16px 20px;
      line-height: 1.6;
      border-radius: 12px;
      font-size: 16px;
    }

    .qa-options button:hover {
      border-color: var(--gold);
      background: rgba(80, 56, 30, 0.5);
    }

    .qa-options button:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .qa-options button.correct,
    .qa-options button.wrong {
      position: relative;
      padding-right: 50px;
      font-weight: 600;
      opacity: 1;
    }

    .qa-options button.correct {
      background: rgba(45, 74, 53, 0.55);
      border-color: rgba(143, 200, 156, 0.55);
      border-width: 2px;
      color: #d6eecc;
    }

    .qa-options button.wrong {
      background: rgba(110, 50, 38, 0.5);
      border-color: rgba(220, 130, 100, 0.55);
      border-width: 2px;
      color: #f6d6c8;
    }

    .qa-options button.correct::after,
    .qa-options button.wrong::after {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .qa-options button.correct::after {
      content: "✓";
      background: var(--leaf);
    }

    .qa-options button.wrong::after {
      content: "✕";
      background: #b35a3c;
    }

    @keyframes feedback-pop {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .qa-feedback {
      margin: 0 0 18px;
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.65;
      animation: feedback-pop 0.22s ease-out;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
    }

    .qa-feedback .qa-feedback-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .qa-feedback .qa-feedback-head::before {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .qa-feedback.correct {
      background: #4d7455;
      color: #fff;
    }

    .qa-feedback.correct .qa-feedback-head::before {
      content: "✓";
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .qa-feedback.wrong {
      background: #b35a3c;
      color: #fff;
    }

    .qa-feedback.wrong .qa-feedback-head::before {
      content: "✕";
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .qa-feedback .qa-feedback-body {
      margin: 0;
    }

    .qa-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .qa-actions button {
      background: #5d3922;
      color: #fff4dd;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .shelf-book {
      border: 1px solid rgba(42, 27, 18, 0.22);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      font: inherit;
      line-height: 1.5;
    }

    .shelf-book:hover { border-color: var(--gold); }

    .shelf-book.locked {
      cursor: not-allowed;
      color: rgba(42, 27, 18, 0.45);
      background: rgba(42, 27, 18, 0.06);
    }

    .shelf-book .book-title {
      font-weight: 600;
      margin: 0 0 4px;
    }

    .shelf-book .book-sub {
      font-size: 13px;
      color: rgba(42, 27, 18, 0.65);
    }

    .book-detail h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .book-detail p { margin: 0 0 12px; }

    .book-detail .back {
      margin-top: 6px;
      background: #5d3922;
      color: #fff4dd;
    }

    .touch-controls {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: none;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px 52px;
      gap: 6px;
      z-index: 10;
    }

    .touch-controls button {
      min-width: 52px;
      min-height: 52px;
      padding: 0;
      font-size: 20px;
      touch-action: none;
    }

    .touch-controls .up { grid-column: 2; grid-row: 1; }
    .touch-controls .left { grid-column: 1; grid-row: 2; }
    .touch-controls .right { grid-column: 3; grid-row: 2; }
    .touch-controls .down { grid-column: 2; grid-row: 3; }

    #interactTouch {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      display: none;
      min-width: 74px;
      min-height: 74px;
      border-radius: 50%;
      z-index: 10;
    }

    @media (max-width: 760px), (pointer: coarse) {
      .touch-controls,
      #interactTouch { display: grid; }
      .pill { max-width: 62vw; font-size: 12px; }
      .settings button { min-height: 34px; font-size: 12px; }
      .dialogue-card { grid-template-columns: 74px 1fr; gap: 12px; }
      .avatar-frame { width: 74px; height: 74px; }
      .modal-content p { font-size: 15px; }
      .qa-layout { grid-template-columns: 1fr; gap: 16px; }
      .qa-bio { position: static; }
      .qa-bio-image { max-height: 220px; aspect-ratio: auto; }
      .qa-hero { padding: 16px 18px 14px; margin-bottom: 16px; }
      .qa-hero-title { font-size: 24px; letter-spacing: 0.32em; }
      .qa-hero-sub { font-size: 12px; }
      .qa-pill { font-size: 12px; padding: 6px 10px; }
      .qa-question { font-size: 16px; }
      .qa-options button { font-size: 15px; padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game" width="1024" height="768" aria-label="慢慢走 Walking Wisdom game canvas"></canvas>
  </div>

  <div class="hud">
    <div id="hint" class="pill">點擊慢慢走咖啡館進入。</div>
    <div class="settings">
      <button id="backWorld" type="button" hidden>返回世界地圖</button>
      <button id="resetProgress" type="button">重置進度</button>
    </div>
  </div>

  <div class="touch-controls" aria-label="方向控制">
    <button class="up" data-dir="up" type="button">↑</button>
    <button class="left" data-dir="left" type="button">←</button>
    <button class="right" data-dir="right" type="button">→</button>
    <button class="down" data-dir="down" type="button">↓</button>
  </div>
  <button id="interactTouch" type="button">對話</button>

  <div id="introModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-content">
        <p>歡迎來到慢慢走咖啡館。這裡有六位智者在不同角落等著與你對話。走近他們，按 Space 或點擊開始對話。每完成一場對話，書架上會多一本書。</p>
        <div class="modal-actions">
          <button id="startJourney" type="button">開始旅程</button>
        </div>
      </div>
    </div>
  </div>

  <div id="talkModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-content dialogue-card">
        <div class="avatar-frame"><img id="talkAvatar" alt=""></div>
        <div>
          <p id="talkName"></p>
          <p id="talkLine"></p>
          <div class="modal-actions">
            <button id="cancelTalk" type="button">先等等</button>
            <button id="openDialogue" type="button">開始對話</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="iframeModal" class="modal-backdrop">
    <div class="modal iframe-modal">
      <div class="iframe-head">
        <span id="iframeTitle">對話體驗</span>
        <button id="closeIframe" type="button">關閉</button>
      </div>
      <div id="dialogueBody" class="dialogue-body"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "walking_wisdom_progress";
    const MASTER_ORDER = ["lieberman", "cavagna", "roberts", "perry", "bernstein", "studenski"];
    const BOOK_LABELS = {
      lieberman: "Lieberman 的書",
      cavagna: "Cavagna 的書",
      roberts: "Roberts 的書",
      perry: "Perry 的書",
      bernstein: "Bernstein 的書",
      studenski: "Studenski 的書"
    };

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const hint = document.getElementById("hint");
    const backWorldBtn = document.getElementById("backWorld");
    const resetBtn = document.getElementById("resetProgress");
    const introModal = document.getElementById("introModal");
    const startJourneyBtn = document.getElementById("startJourney");
    const talkModal = document.getElementById("talkModal");
    const talkAvatar = document.getElementById("talkAvatar");
    const talkName = document.getElementById("talkName");
    const talkLine = document.getElementById("talkLine");
    const cancelTalk = document.getElementById("cancelTalk");
    const openDialogue = document.getElementById("openDialogue");
    const iframeModal = document.getElementById("iframeModal");
    const dialogueBody = document.getElementById("dialogueBody");
    const iframeTitle = document.getElementById("iframeTitle");
    const closeIframe = document.getElementById("closeIframe");
    const interactTouch = document.getElementById("interactTouch");

    const state = {
      scene: "world",
      assetsReady: false,
      images: {},
      worldZones: null,
      cafeEntities: null,
      collision: null,
      props: null,
      npcFreeze: false,
      nextNpcChatAt: 18,
      activeNpcChat: null,
      progress: loadProgress(),
      activeMaster: null,
      dialogues: null,
      iframeTimer: 0,
      keys: new Set(),
      touchDir: null,
      pointer: { x: 0, y: 0 },
      tooltip: null,
      debugCollision: false,
      player: {
        x: 500,
        y: 675,
        dir: "down",
        moving: false,
        frame: 0,
        frameTime: 0,
        path: [],
        autoInteract: null
      }
    };

    const DIRS = {
      down: { x: 0, y: 1, row: 0 },
      left: { x: -1, y: 0, row: 1 },
      right: { x: 1, y: 0, row: 2 },
      up: { x: 0, y: -1, row: 3 }
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { version: 1, masters_completed: [], intro_seen: false };
        const parsed = JSON.parse(raw);
        return {
          version: 1,
          masters_completed: Array.isArray(parsed.masters_completed) ? parsed.masters_completed : [],
          intro_seen: Boolean(parsed.intro_seen)
        };
      } catch {
        return { version: 1, masters_completed: [], intro_seen: false };
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    }

    function completeMaster(id) {
      if (!MASTER_ORDER.includes(id)) return;
      if (!state.progress.masters_completed.includes(id)) {
        state.progress.masters_completed.push(id);
        state.progress.masters_completed.sort((a, b) => MASTER_ORDER.indexOf(a) - MASTER_ORDER.indexOf(b));
      }
      saveProgress();
      hint.textContent = `${BOOK_LABELS[id]} 已放上旅程書架。`;
    }

    function image(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function json(src) {
      const res = await fetch(src);
      return res.json();
    }

    async function boot() {
      const params = new URLSearchParams(location.search);
      const completed = params.get("completed");
      if (completed) {
        completeMaster(completed);
        history.replaceState(null, "", location.pathname);
      }
      if (params.get("debug") === "collision") state.debugCollision = true;

      const [worldZones, cafeEntities, collision, props, dialogues] = await Promise.all([
        json("data/world-zones.json"),
        json("data/cafe-entities.json"),
        json("data/cafe-collision.json"),
        json("data/cafe-props.json"),
        json("data/dialogues.json")
      ]);
      state.worldZones = worldZones;
      state.cafeEntities = cafeEntities;
      state.collision = collision;
      state.props = props;
      state.dialogues = dialogues;

      const imageEntries = [
        ["world", "assets/maps/world-map.png"],
        ["cafe", "assets/maps/cafe-base.png"],
        ["player", "assets/sprites/player/traveler-walk-4x4.png"],
        ...props.bookshelf_states.map((src, i) => [`bookshelf${i}`, src]),
        ...cafeEntities.masters.map((m) => [m.id, m.sprite]),
        ...cafeEntities.masters.map((m) => [`walk_${m.id}`, m.walk_sprite]),
        ...cafeEntities.masters.map((m) => [`avatar_${m.id}`, m.avatar])
      ];
      const loaded = await Promise.all(imageEntries.map(async ([key, src]) => [key, await image(src)]));
      state.images = Object.fromEntries(loaded);
      state.assetsReady = true;

      const spawn = cafeEntities.player_spawn;
      state.player.x = spawn.x;
      state.player.y = spawn.y;
      initNpcAi();

      if (!state.progress.intro_seen) introModal.classList.add("show");
      requestAnimationFrame(loop);
    }

    function toWorldPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((event.clientX - rect.left) / rect.width) * canvas.width,
        y: ((event.clientY - rect.top) / rect.height) * canvas.height
      };
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function rectContains(rect, x, y, pad = 0) {
      return x >= rect.x - pad && x <= rect.x + rect.w + pad && y >= rect.y - pad && y <= rect.y + rect.h + pad;
    }

    function isBlocked(x, y) {
      const bounds = state.collision.walk_bounds;
      if (!rectContains(bounds, x, y)) return true;
      return state.collision.blocked_rects.some((rect) => rectContains(rect, x, y));
    }

    function canMoveTo(x, y) {
      const footPad = 13;
      return !isBlocked(x, y) && !isBlocked(x - footPad, y) && !isBlocked(x + footPad, y) && !isBlocked(x, y - 8);
    }

    function initNpcAi() {
      state.cafeEntities.masters.forEach((master, index) => {
        master.position = nearestWalkable(master.position);
        master.ai = {
          x: master.position.x,
          y: master.position.y,
          dir: "down",
          frame: 0,
          frameTime: 0,
          path: [],
          moving: false,
          idleTime: 1 + Math.random() * 2 + index * 0.15,
          highlighted: false,
          chatting: false,
          bubble: "",
          bubbleTime: 0
        };
      });
    }

    function nearestWalkable(point) {
      if (canMoveTo(point.x, point.y)) return point;
      for (let r = 16; r <= 160; r += 16) {
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
          const p = { x: point.x + Math.cos(a) * r, y: point.y + Math.sin(a) * r };
          if (canMoveTo(p.x, p.y)) return p;
        }
      }
      return { x: state.player.x, y: state.player.y };
    }

    function findPath(start, target) {
      const tile = state.collision.tile_size || 32;
      const cols = Math.ceil(canvas.width / tile);
      const rows = Math.ceil(canvas.height / tile);
      const toCell = (p) => ({
        x: Math.max(0, Math.min(cols - 1, Math.floor(p.x / tile))),
        y: Math.max(0, Math.min(rows - 1, Math.floor(p.y / tile)))
      });
      const toPoint = (c) => ({ x: c.x * tile + tile / 2, y: c.y * tile + tile / 2 });
      const startCell = toCell(start);
      const targetCell = toCell(nearestWalkable(target));
      const key = (c) => `${c.x},${c.y}`;
      const walkable = (c) => c.x >= 0 && c.y >= 0 && c.x < cols && c.y < rows && canMoveTo(...Object.values(toPoint(c)));
      const open = [startCell];
      const came = new Map();
      const g = new Map([[key(startCell), 0]]);
      const f = new Map([[key(startCell), Math.abs(startCell.x - targetCell.x) + Math.abs(startCell.y - targetCell.y)]]);
      const closed = new Set();

      while (open.length) {
        open.sort((a, b) => (f.get(key(a)) || Infinity) - (f.get(key(b)) || Infinity));
        const current = open.shift();
        const currentKey = key(current);
        if (current.x === targetCell.x && current.y === targetCell.y) {
          const cells = [current];
          let cursor = currentKey;
          while (came.has(cursor)) {
            const prev = came.get(cursor);
            cells.unshift(prev);
            cursor = key(prev);
          }
          return cells.slice(1).map(toPoint);
        }
        closed.add(currentKey);
        for (const n of [
          { x: current.x + 1, y: current.y },
          { x: current.x - 1, y: current.y },
          { x: current.x, y: current.y + 1 },
          { x: current.x, y: current.y - 1 }
        ]) {
          const nKey = key(n);
          if (closed.has(nKey) || !walkable(n)) continue;
          const tentative = (g.get(currentKey) || 0) + 1;
          if (!open.some((c) => key(c) === nKey)) open.push(n);
          if (tentative >= (g.get(nKey) || Infinity)) continue;
          came.set(nKey, current);
          g.set(nKey, tentative);
          f.set(nKey, tentative + Math.abs(n.x - targetCell.x) + Math.abs(n.y - targetCell.y));
        }
      }
      return [nearestWalkable(target)];
    }

    function enterCafe() {
      state.scene = "cafe";
      backWorldBtn.hidden = false;
      const spawn = state.cafeEntities.player_spawn;
      state.player.x = spawn.x;
      state.player.y = spawn.y;
      state.player.path = [];
      state.player.autoInteract = null;
      hint.textContent = "走近智者，按 Space / Enter 或點擊 NPC 開始對話。";
    }

    function enterWorld() {
      state.scene = "world";
      backWorldBtn.hidden = true;
      hint.textContent = "點擊慢慢走咖啡館進入。";
    }

    function masterAt(point) {
      return state.cafeEntities.masters.find((m) => dist(point, masterPoint(m)) < 62);
    }

    function nearbyMaster() {
      return state.cafeEntities.masters.find((m) => dist(state.player, masterPoint(m)) < 92);
    }

    function nearbyBookshelf() {
      const box = state.cafeEntities.bookshelf;
      if (!box) return false;
      const px = state.player.x;
      const py = state.player.y;
      const cx = Math.max(box.x, Math.min(px, box.x + box.w));
      const cy = Math.max(box.y, Math.min(py, box.y + box.h));
      return Math.hypot(px - cx, py - cy) < 90;
    }

    function interactBookshelf() {
      const pending = state.activeMaster &&
        !state.progress.masters_completed.includes(state.activeMaster.id)
        ? state.activeMaster
        : null;
      if (pending) {
        completeMaster(pending.id);
        state.activeMaster = null;
      }
      openSharedShelf();
    }

    function openSharedShelf() {
      iframeTitle.textContent = "旅程書架";
      iframeModal.classList.add("show");
      state.npcFreeze = true;
      state.openingShelf = true;
      renderShelf();
    }

    function renderShelf() {
      const grid = document.createElement("div");
      grid.className = "shelf-grid";
      for (const id of MASTER_ORDER) {
        const master = state.cafeEntities.masters.find((m) => m.id === id);
        const dialogue = state.dialogues[id];
        const unlocked = state.progress.masters_completed.includes(id);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "shelf-book" + (unlocked ? "" : " locked");
        const titleText = unlocked && dialogue ? dialogue.bio.title : (master ? master.book_label : id);
        const subText = unlocked ? "翻閱這本書" : "尚未解鎖 — 先去找這位智者對話";
        button.innerHTML = `<p class="book-title"></p><p class="book-sub"></p>`;
        button.querySelector(".book-title").textContent = titleText;
        button.querySelector(".book-sub").textContent = subText;
        if (unlocked) {
          button.addEventListener("click", () => renderBookDetail(id));
        } else {
          button.disabled = true;
        }
        grid.appendChild(button);
      }
      dialogueBody.innerHTML = "";
      dialogueBody.appendChild(grid);
    }

    function renderBookDetail(masterId) {
      const dialogue = state.dialogues[masterId];
      if (!dialogue) return;
      const wrap = document.createElement("div");
      wrap.className = "book-detail";
      const heading = document.createElement("h3");
      heading.textContent = dialogue.bio.title || "";
      wrap.appendChild(heading);
      for (const line of dialogue.bio.lines) {
        const p = document.createElement("p");
        p.textContent = line;
        wrap.appendChild(p);
      }
      const back = document.createElement("button");
      back.type = "button";
      back.className = "back";
      back.textContent = "回到書架";
      back.addEventListener("click", renderShelf);
      wrap.appendChild(back);
      dialogueBody.innerHTML = "";
      dialogueBody.appendChild(wrap);
    }

    function updateBookshelfHint() {
      const near = nearbyBookshelf();
      if (near === state.bookshelfNear) return;
      state.bookshelfNear = near;
      if (!near) return;
      const m = state.activeMaster;
      if (m && !state.progress.masters_completed.includes(m.id)) {
        hint.textContent = `按 Space 把 ${m.name} 的書放上旅程書架。`;
      } else {
        const n = state.progress.masters_completed.length;
        hint.textContent = `旅程書架（${n} / 6）：先去找一位智者對話，再回來解鎖新書。`;
      }
    }

    function masterPoint(master) {
      return master.ai ? { x: master.ai.x, y: master.ai.y } : master.position;
    }

    function startTalk(master) {
      endNpcChat();
      state.activeMaster = master;
      state.npcFreeze = true;
      talkName.textContent = master.name;
      talkLine.textContent = master.intro;
      const avatar = state.images[`avatar_${master.id}`];
      talkAvatar.src = avatar ? master.avatar : master.sprite;
      talkAvatar.alt = master.name;
      talkModal.classList.add("show");
    }

    function openDialogueExperience(master) {
      const dialogue = state.dialogues && state.dialogues[master.id];
      if (!dialogue || !dialogue.questions.length) {
        hint.textContent = `${master.name} 的對話內容尚未建立。`;
        return;
      }
      iframeTitle.textContent = "慢慢走咖啡館";
      iframeModal.classList.add("show");
      state.npcFreeze = true;
      state.openingShelf = false;
      const questionMap = new Map(dialogue.questions.map((q) => [q.id, q]));
      const session = { answered: 0, correct: 0, wrong: 0, currentNodeId: dialogue.questions[0].id };
      buildDialogueLayout(master, dialogue, session);
      renderQuestion(master, dialogue, questionMap, dialogue.questions[0], session);
    }

    function buildDialogueLayout(master, dialogue, session) {
      dialogueBody.innerHTML = "";

      const hero = document.createElement("section");
      hero.className = "qa-hero";

      const heroTitle = document.createElement("h2");
      heroTitle.className = "qa-hero-title";
      heroTitle.textContent = "慢慢走咖啡館";
      hero.appendChild(heroTitle);

      const heroSub = document.createElement("p");
      heroSub.className = "qa-hero-sub";
      heroSub.textContent = "慢慢走咖啡館是一個以步態力學為主題的互動式劇情遊戲。每道題目都是一個節點，答對與答錯都會帶你走向不同的知識路徑。";
      hero.appendChild(heroSub);

      const pills = document.createElement("div");
      pills.className = "qa-pills";
      pills.id = "qaPills";
      pills.appendChild(makePill("目前章節", dialogue.character_name || master.name));
      pills.appendChild(makePill("節點 ID", session.currentNodeId, "qaPillNode"));
      pills.appendChild(makePill("已回答", session.answered, "qaPillAnswered"));
      const score = makePill("答對", `${session.correct} / 答錯：${session.wrong}`, "qaPillScore");
      score.classList.add("success");
      pills.appendChild(score);
      hero.appendChild(pills);

      dialogueBody.appendChild(hero);

      const layout = document.createElement("div");
      layout.className = "qa-layout";

      const bio = document.createElement("aside");
      bio.className = "qa-bio";

      const firstImg = (dialogue.questions[0] && dialogue.questions[0].image) || master.avatar;
      if (firstImg) {
        const img = document.createElement("img");
        img.className = "qa-bio-image";
        img.id = "qaBioImage";
        img.src = firstImg;
        img.alt = dialogue.character_name || master.name;
        bio.appendChild(img);
      }

      const label = document.createElement("p");
      label.className = "qa-bio-label";
      label.textContent = "CHARACTER";
      bio.appendChild(label);

      const name = document.createElement("h3");
      name.className = "qa-bio-name";
      name.textContent = dialogue.character_name || master.name;
      bio.appendChild(name);

      if (dialogue.bio && Array.isArray(dialogue.bio.lines) && dialogue.bio.lines.length) {
        const lines = document.createElement("div");
        lines.className = "qa-bio-lines";
        for (const line of dialogue.bio.lines) {
          const p = document.createElement("p");
          p.textContent = line;
          lines.appendChild(p);
        }
        bio.appendChild(lines);
      }

      if (dialogue.bio && dialogue.bio.title) {
        const title = document.createElement("p");
        title.className = "qa-bio-title";
        title.textContent = dialogue.bio.title;
        bio.appendChild(title);
      }

      const content = document.createElement("div");
      content.className = "qa-content";
      content.id = "qaContent";

      layout.appendChild(bio);
      layout.appendChild(content);
      dialogueBody.appendChild(layout);
    }

    function makePill(key, value, valueId) {
      const pill = document.createElement("div");
      pill.className = "qa-pill";
      const k = document.createElement("span");
      k.className = "pill-key";
      k.textContent = `${key} :`;
      const v = document.createElement("span");
      v.className = "pill-value";
      if (valueId) v.id = valueId;
      v.textContent = value;
      pill.appendChild(k);
      pill.appendChild(v);
      return pill;
    }

    function updatePills(session) {
      const node = document.getElementById("qaPillNode");
      const answered = document.getElementById("qaPillAnswered");
      const score = document.getElementById("qaPillScore");
      if (node) node.textContent = session.currentNodeId;
      if (answered) answered.textContent = session.answered;
      if (score) score.textContent = `${session.correct} / 答錯：${session.wrong}`;
    }

    function renderQuestion(master, dialogue, questionMap, question, session) {
      const content = document.getElementById("qaContent");
      if (!content) return;

      const bioImg = document.getElementById("qaBioImage");
      if (bioImg && question.image) {
        bioImg.src = question.image;
      }

      session.currentNodeId = question.id;
      updatePills(session);

      const wrap = document.createElement("div");

      const tag = document.createElement("p");
      tag.className = "qa-cafe-tag";
      tag.textContent = "STEP BY STEP CAFE";
      wrap.appendChild(tag);

      const text = document.createElement("p");
      text.className = "qa-question";
      text.textContent = question.text;
      wrap.appendChild(text);

      const opts = document.createElement("div");
      opts.className = "qa-options";
      for (const option of question.options) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = option;
        btn.addEventListener("click", () => {
          const correct = option === question.answer;
          for (const sibling of opts.querySelectorAll("button")) {
            sibling.disabled = true;
            if (sibling.textContent === question.answer) sibling.classList.add("correct");
          }
          if (!correct) btn.classList.add("wrong");
          session.answered += 1;
          if (correct) session.correct += 1; else session.wrong += 1;
          updatePills(session);
          showFeedback(master, dialogue, questionMap, question, correct, session);
        });
        opts.appendChild(btn);
      }
      wrap.appendChild(opts);

      content.innerHTML = "";
      content.appendChild(wrap);
      dialogueBody.scrollTop = 0;
    }

    function showFeedback(master, dialogue, questionMap, question, correct, session) {
      const content = document.getElementById("qaContent");
      if (!content) return;

      const feedback = document.createElement("div");
      feedback.className = "qa-feedback " + (correct ? "correct" : "wrong");
      const head = document.createElement("div");
      head.className = "qa-feedback-head";
      head.textContent = correct ? "答對了！" : "再想一想";
      const body = document.createElement("p");
      body.className = "qa-feedback-body";
      body.textContent = correct ? question.feedback_correct : question.feedback_wrong;
      feedback.appendChild(head);
      feedback.appendChild(body);
      content.appendChild(feedback);

      const actions = document.createElement("div");
      actions.className = "qa-actions";

      const nextId = correct ? question.next_correct : question.next_wrong;
      const nextQuestion = nextId != null ? questionMap.get(nextId) : null;

      if (correct && !nextQuestion) {
        completeMaster(master.id);
        const finishBtn = document.createElement("button");
        finishBtn.type = "button";
        finishBtn.textContent = "完成對話";
        finishBtn.addEventListener("click", closeDialogueModal);
        actions.appendChild(finishBtn);
      } else if (nextQuestion) {
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.textContent = correct ? "下一題" : "再試一次";
        nextBtn.addEventListener("click", () => {
          renderQuestion(master, dialogue, questionMap, nextQuestion, session);
        });
        actions.appendChild(nextBtn);
      } else {
        const closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.textContent = "下次再來";
        closeBtn.addEventListener("click", closeDialogueModal);
        actions.appendChild(closeBtn);
      }

      content.appendChild(actions);
      dialogueBody.scrollTop = dialogueBody.scrollHeight;
    }

    function closeDialogueModal() {
      iframeModal.classList.remove("show");
      dialogueBody.innerHTML = "";
      state.npcFreeze = false;
      const wasShelf = state.openingShelf;
      state.openingShelf = false;
      if (wasShelf) return;
      const m = state.activeMaster;
      if (m && !state.progress.masters_completed.includes(m.id)) {
        hint.textContent = `走到旅程書架前按 Space，翻閱 ${m.name} 的書。`;
      }
    }

    function update(dt) {
      if (!state.assetsReady || state.scene !== "cafe") return;
      updateNpcs(dt);
      updateBookshelfHint();
      const speed = 150;
      let dx = 0;
      let dy = 0;
      if (state.keys.has("arrowup") || state.keys.has("w") || state.touchDir === "up") dy -= 1;
      if (state.keys.has("arrowdown") || state.keys.has("s") || state.touchDir === "down") dy += 1;
      if (state.keys.has("arrowleft") || state.keys.has("a") || state.touchDir === "left") dx -= 1;
      if (state.keys.has("arrowright") || state.keys.has("d") || state.touchDir === "right") dx += 1;

      if (dx || dy) {
        state.player.path = [];
        state.player.autoInteract = null;
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;
        movePlayer(dx * speed * dt, dy * speed * dt);
      } else if (state.player.path.length) {
        const target = state.player.path[0];
        const vx = target.x - state.player.x;
        const vy = target.y - state.player.y;
        const len = Math.hypot(vx, vy);
        if (len < 4) {
          state.player.path.shift();
          if (!state.player.path.length && state.player.autoInteract) {
            const master = state.player.autoInteract;
            state.player.autoInteract = null;
            startTalk(master);
          }
        } else {
          movePlayer((vx / len) * speed * dt, (vy / len) * speed * dt);
        }
      } else {
        state.player.moving = false;
      }

      if (state.player.moving) {
        state.player.frameTime += dt;
        if (state.player.frameTime > 0.14) {
          state.player.frame = (state.player.frame + 1) % 4;
          state.player.frameTime = 0;
        }
      } else {
        state.player.frame = 0;
      }
    }

    function updateNpcs(dt) {
      const frozenByModal = state.npcFreeze || talkModal.classList.contains("show") || iframeModal.classList.contains("show") || introModal.classList.contains("show");
      updateNpcChat(dt, frozenByModal);
      for (const master of state.cafeEntities.masters) {
        updateSingleNpc(master, dt, frozenByModal);
      }
    }

    function updateSingleNpc(master, dt, frozenByModal) {
      const ai = master.ai;
      if (!ai) return;
      const playerDistance = dist(state.player, ai);
      ai.highlighted = playerDistance < 120;
      if (ai.highlighted) {
        if (ai.chatting) endNpcChat();
        ai.path = [];
        ai.moving = false;
        ai.dir = directionToward(ai, state.player);
        return;
      }
      if (frozenByModal || ai.chatting) {
        ai.moving = false;
        return;
      }

      if (ai.path.length) {
        const target = ai.path[0];
        const vx = target.x - ai.x;
        const vy = target.y - ai.y;
        const len = Math.hypot(vx, vy);
        if (len < 3) {
          ai.path.shift();
          if (!ai.path.length) {
            ai.moving = false;
            ai.idleTime = 1 + Math.random() * 2;
          }
        } else {
          moveNpc(master, (vx / len) * 75 * dt, (vy / len) * 75 * dt);
        }
      } else {
        ai.moving = false;
        ai.idleTime -= dt;
        if (ai.idleTime <= 0) {
          if (Math.random() < 0.28) ai.dir = randomDir();
          const target = randomPointInZone(master.roam_zone);
          ai.path = findPath(ai, target).slice(0, 14);
          if (!ai.path.length) ai.idleTime = 1 + Math.random() * 2;
        }
      }

      if (ai.moving) {
        ai.frameTime += dt;
        if (ai.frameTime > 0.18) {
          ai.frame = (ai.frame + 1) % 4;
          ai.frameTime = 0;
        }
      } else {
        ai.frame = 0;
      }
    }

    function moveNpc(master, dx, dy) {
      const ai = master.ai;
      const nextX = ai.x + dx;
      const nextY = ai.y + dy;
      if (Math.abs(dx) > Math.abs(dy)) ai.dir = dx > 0 ? "right" : "left";
      else if (dy !== 0) ai.dir = dy > 0 ? "down" : "up";
      let moved = false;
      if (canMoveTo(nextX, ai.y)) {
        ai.x = nextX;
        moved = true;
      }
      if (canMoveTo(ai.x, nextY)) {
        ai.y = nextY;
        moved = true;
      }
      master.position.x = ai.x;
      master.position.y = ai.y;
      ai.moving = moved;
    }

    function randomPointInZone(zone) {
      for (let i = 0; i < 18; i++) {
        const point = {
          x: zone.x + Math.random() * zone.w,
          y: zone.y + Math.random() * zone.h
        };
        if (canMoveTo(point.x, point.y)) return point;
      }
      return nearestWalkable({ x: zone.x + zone.w / 2, y: zone.y + zone.h / 2 });
    }

    function randomDir() {
      return ["down", "left", "right", "up"][Math.floor(Math.random() * 4)];
    }

    function directionToward(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "right" : "left";
      return dy > 0 ? "down" : "up";
    }

    function updateNpcChat(dt, frozenByModal) {
      if (state.activeNpcChat) {
        state.activeNpcChat.time -= dt;
        const [a, b] = state.activeNpcChat.masters;
        if (dist(state.player, a.ai) < 120 || dist(state.player, b.ai) < 120 || state.activeNpcChat.time <= 0 || frozenByModal) {
          endNpcChat();
        }
        return;
      }
      if (frozenByModal) return;
      state.nextNpcChatAt -= dt;
      if (state.nextNpcChatAt > 0) return;
      state.nextNpcChatAt = 15 + Math.random() * 10;
      const candidates = [];
      const masters = state.cafeEntities.masters;
      for (let i = 0; i < masters.length; i++) {
        for (let j = i + 1; j < masters.length; j++) {
          const a = masters[i];
          const b = masters[j];
          if (a.ai.highlighted || b.ai.highlighted || a.ai.path.length || b.ai.path.length) continue;
          const d = dist(a.ai, b.ai);
          if (d < 210) candidates.push([a, b, d]);
        }
      }
      if (!candidates.length) return;
      candidates.sort((a, b) => a[2] - b[2]);
      const [a, b] = candidates[Math.min(candidates.length - 1, Math.floor(Math.random() * 3))];
      startNpcChat(a, b);
    }

    function startNpcChat(a, b) {
      const bubble = npcChatBubble(a.id, b.id);
      a.ai.path = [];
      b.ai.path = [];
      a.ai.chatting = true;
      b.ai.chatting = true;
      a.ai.bubble = bubble;
      b.ai.bubble = bubble;
      a.ai.dir = directionToward(a.ai, b.ai);
      b.ai.dir = directionToward(b.ai, a.ai);
      state.activeNpcChat = { masters: [a, b], time: 4 + Math.random() * 2 };
    }

    function endNpcChat() {
      if (!state.activeNpcChat) return;
      for (const master of state.activeNpcChat.masters) {
        master.ai.chatting = false;
        master.ai.bubble = "";
        master.ai.idleTime = 1 + Math.random() * 2;
      }
      state.activeNpcChat = null;
    }

    function npcChatBubble(a, b) {
      const pair = [a, b].sort().join("+");
      const bubbles = {
        "cavagna+lieberman": "🦴",
        "perry+studenski": "👣",
        "bernstein+roberts": "⚡"
      };
      return bubbles[pair] || "💭";
    }

    function movePlayer(dx, dy) {
      const nextX = state.player.x + dx;
      const nextY = state.player.y + dy;
      if (Math.abs(dx) > Math.abs(dy)) state.player.dir = dx > 0 ? "right" : "left";
      else if (dy !== 0) state.player.dir = dy > 0 ? "down" : "up";
      let moved = false;
      if (canMoveTo(nextX, state.player.y)) {
        state.player.x = nextX;
        moved = true;
      }
      if (canMoveTo(state.player.x, nextY)) {
        state.player.y = nextY;
        moved = true;
      }
      state.player.moving = moved;
    }

    function drawImageCover(img) {
      if (!img) return;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    function drawWorld() {
      drawImageCover(state.images.world);
      const cafe = state.worldZones.locations[0];
      ctx.save();
      ctx.strokeStyle = "rgba(255, 244, 221, 0.95)";
      ctx.lineWidth = 4;
      ctx.fillStyle = "rgba(242, 196, 109, 0.22)";
      ctx.beginPath();
      ctx.arc(cafe.x, cafe.y, cafe.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      drawLabel(cafe.name, cafe.x, cafe.y - 104, "#fff4dd", "#5d3922");
      ctx.restore();
    }

    function drawCafe() {
      drawImageCover(state.images.cafe);
      drawBookshelf();
      const drawables = [
        ...state.cafeEntities.masters.map((m) => ({ type: "master", y: masterPoint(m).y, data: m })),
        { type: "player", y: state.player.y, data: state.player }
      ].sort((a, b) => a.y - b.y);
      for (const item of drawables) {
        if (item.type === "master") drawMaster(item.data);
        else drawPlayer();
      }
      drawBookTooltip();
      if (state.debugCollision) drawDebugCollision();
    }

    function drawDebugCollision() {
      const c = state.collision;
      if (!c) return;
      ctx.save();
      ctx.fillStyle = "rgba(255, 50, 50, 0.32)";
      ctx.strokeStyle = "rgba(255, 80, 80, 0.95)";
      ctx.lineWidth = 2;
      c.blocked_rects.forEach((r, i) => {
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = "#fff";
        ctx.font = "600 14px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(`#${i}`, r.x + 4, r.y + 4);
        ctx.fillStyle = "rgba(255, 50, 50, 0.32)";
      });
      ctx.strokeStyle = "rgba(60, 220, 100, 0.95)";
      ctx.lineWidth = 3;
      const wb = c.walk_bounds;
      ctx.strokeRect(wb.x, wb.y, wb.w, wb.h);
      ctx.fillStyle = "#0f0";
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "600 14px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`player ${Math.round(state.player.x)}, ${Math.round(state.player.y)}`, 56, 224);
      ctx.restore();
    }

    function drawBookshelf() {
      const box = state.cafeEntities.bookshelf;
      const near = state.scene === "cafe" && nearbyBookshelf();
      if (near) {
        ctx.save();
        ctx.strokeStyle = "rgba(245, 209, 141, 0.95)";
        ctx.lineWidth = 3;
        ctx.shadowColor = "rgba(245, 209, 141, 0.7)";
        ctx.shadowBlur = 22;
        ctx.strokeRect(box.x - 2, box.y - 2, box.w + 4, box.h + 4);
        ctx.restore();
      }
      const n = state.progress.masters_completed.length;
      drawLabel(`旅程書架  ${n} / 6`, box.x + box.w / 2, box.label_y,
        near ? "#f5d18d" : "#fff4dd",
        near ? "#5c3922" : "#4f321f");
    }

    function drawBookTooltip() {
      if (!state.tooltip) return;
      drawLabel(state.tooltip.text, state.tooltip.x, state.tooltip.y, "#2a1b12", "#fff4dd");
    }

    function drawMaster(master) {
      const ai = master.ai || { x: master.position.x, y: master.position.y, dir: "down", frame: 0, highlighted: false, bubble: "" };
      const walkImg = state.images[`walk_${master.id}`];
      const staticImg = state.images[master.id];
      const w = 52;
      const h = 88;
      if (walkImg) {
        const row = DIRS[ai.dir].row;
        const col = ai.frame || 0;
        ctx.drawImage(walkImg, col * 64, row * 64, 64, 64, ai.x - 24, ai.y - 50, 48, 48);
      } else if (staticImg) {
        ctx.drawImage(staticImg, ai.x - w / 2, ai.y - h + 14, w, h);
      }
      if (state.progress.masters_completed.includes(master.id)) {
        ctx.fillStyle = "#f2c46d";
        ctx.beginPath();
        ctx.arc(ai.x + 22, ai.y - 72, 7, 0, Math.PI * 2);
        ctx.fill();
      }
      if (ai.bubble) drawSpeechBubble(ai.bubble, ai.x, ai.y - 72);
      const bg = ai.highlighted ? "rgba(92,57,34,0.94)" : "rgba(42,27,18,0.78)";
      const color = ai.highlighted ? "#f2c46d" : "#fff4dd";
      drawLabel(master.name, ai.x, ai.y - h + 2, color, bg, 12);
    }

    function drawSpeechBubble(text, x, y) {
      ctx.save();
      ctx.font = "20px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      roundRect(x - 20, y - 18, 40, 30, 8);
      ctx.fillStyle = "rgba(255,244,221,0.92)";
      ctx.fill();
      ctx.fillStyle = "#2a1b12";
      ctx.fillText(text, x, y - 3);
      ctx.restore();
    }

    function drawPlayer() {
      const img = state.images.player;
      if (!img) return;
      const row = DIRS[state.player.dir].row;
      const col = state.player.frame;
      ctx.drawImage(img, col * 64, row * 64, 64, 64, state.player.x - 24, state.player.y - 50, 48, 48);
    }

    function drawLabel(text, x, y, color = "#fff4dd", bg = "rgba(42,27,18,0.72)", size = 14) {
      ctx.save();
      ctx.font = `600 ${size}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const metrics = ctx.measureText(text);
      const width = Math.min(metrics.width + 18, 260);
      const height = size + 12;
      const left = Math.max(8, Math.min(canvas.width - width - 8, x - width / 2));
      const top = y - height / 2;
      roundRect(left, top, width, height, 7);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.fillStyle = color;
      ctx.fillText(text, left + width / 2, y, width - 12);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function updateTooltip(point) {
      state.tooltip = null;
      if (state.scene !== "cafe") return;
      const box = state.cafeEntities.bookshelf;
      if (!rectContains(box, point.x, point.y)) return;
      const completed = state.progress.masters_completed;
      const slot = Math.floor((point.x - box.x - 10) / 20);
      const id = completed[slot];
      if (id) state.tooltip = { text: BOOK_LABELS[id], x: point.x, y: point.y - 28 };
    }

    function handleCanvasClick(event) {
      const point = toWorldPoint(event);
      if (state.scene === "world") {
        const cafe = state.worldZones.locations[0];
        if (dist(point, cafe) <= cafe.radius) enterCafe();
        return;
      }
      const master = masterAt(point);
      if (master) {
        state.player.path = findPath(state.player, approachPointForMaster(master));
        state.player.autoInteract = master;
      } else if (canMoveTo(point.x, point.y)) {
        state.player.path = findPath(state.player, point);
        state.player.autoInteract = null;
      }
    }

    function approachPointForMaster(master) {
      const p = masterPoint(master);
      const vx = state.player.x - p.x;
      const vy = state.player.y - p.y;
      const len = Math.hypot(vx, vy) || 1;
      return nearestWalkable({ x: p.x + (vx / len) * 58, y: p.y + (vy / len) * 58 });
    }

    canvas.addEventListener("pointerdown", handleCanvasClick);
    canvas.addEventListener("pointermove", (event) => updateTooltip(toWorldPoint(event)));

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " ", "enter"].includes(key)) {
        event.preventDefault();
      }
      if (key === "g") {
        state.debugCollision = !state.debugCollision;
        hint.textContent = `碰撞 debug: ${state.debugCollision ? "ON" : "OFF"}`;
        return;
      }
      if (key === " " || key === "enter") {
        if (state.scene === "cafe") {
          if (nearbyBookshelf()) {
            interactBookshelf();
            return;
          }
          const master = nearbyMaster();
          if (master) {
            startTalk(master);
            return;
          }
        }
        return;
      }
      state.keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      state.keys.delete(event.key.toLowerCase());
    });

    document.querySelectorAll(".touch-controls button").forEach((button) => {
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        state.touchDir = button.dataset.dir;
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointerup", () => state.touchDir = null);
      button.addEventListener("pointercancel", () => state.touchDir = null);
    });

    interactTouch.addEventListener("click", () => {
      if (state.scene !== "cafe") return;
      if (nearbyBookshelf()) { interactBookshelf(); return; }
      const master = nearbyMaster();
      if (master) startTalk(master);
    });

    startJourneyBtn.addEventListener("click", () => {
      state.progress.intro_seen = true;
      saveProgress();
      introModal.classList.remove("show");
    });

    cancelTalk.addEventListener("click", () => {
      talkModal.classList.remove("show");
      state.npcFreeze = false;
      state.activeMaster = null;
    });

    openDialogue.addEventListener("click", () => {
      const master = state.activeMaster;
      if (!master) return;
      talkModal.classList.remove("show");
      openDialogueExperience(master);
    });

    closeIframe.addEventListener("click", closeDialogueModal);

    backWorldBtn.addEventListener("click", enterWorld);

    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state.progress = loadProgress();
      introModal.classList.add("show");
      hint.textContent = state.scene === "world" ? "點擊慢慢走咖啡館進入。" : "進度已重置。";
    });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!state.assetsReady) {
        ctx.fillStyle = "#211813";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawLabel("載入中...", canvas.width / 2, canvas.height / 2);
      } else if (state.scene === "world") {
        drawWorld();
      } else {
        drawCafe();
      }
      requestAnimationFrame(loop);
    }

    boot();
  </script>
</body>
</html>
